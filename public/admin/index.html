<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Админка — Бака!</title>
		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
		<script type="module">
			// Кавычка ломает разбор синтаксиса блока ::image{...}, поэтому в записанном
			// в файл тексте её заменяют на &quot;. Обратную замену делает плагин
			// src/plugins/remark-image-figure.mjs — при изменении логики поправить и там, и там.
			const escapeAttr = (value) => String(value ?? '').replaceAll('"', '&quot;');
			const escapeHtml = (value) =>
				String(value ?? '')
					.replaceAll('&', '&amp;')
					.replaceAll('<', '&lt;')
					.replaceAll('>', '&gt;')
					.replaceAll('"', '&quot;');

			CMS.registerEditorComponent({
				// id отдельно от синтаксиса ::image{...} в тексте — так называется только
				// сама кнопка/пункт в CMS. Встроенный простой блок картинки уже занял id "image".
				id: 'figure',
				label: 'Изображение с подписью',
				icon: 'image',
				fields: [
					{ label: 'Файл', name: 'src', widget: 'image' },
					{ label: 'Альт-текст (для незрячих и поиска)', name: 'alt', widget: 'string' },
					{ label: 'Подпись под картинкой', name: 'caption', widget: 'string', required: false },
					{
						label: 'Ширина',
						name: 'width',
						widget: 'select',
						options: [
							{ label: 'В колонку', value: 'column' },
							{ label: 'Во всю ширину', value: 'full' },
						],
						default: 'column',
					},
					{ label: 'Текст ссылки на источник', name: 'source-label', widget: 'string', required: false },
					{ label: 'Ссылка на источник', name: 'source-url', widget: 'string', required: false },
				],
				pattern: /^::image\{([^\n]*)\}$/,
				fromBlock: (match) => {
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[1]))) {
						attrs[m[1]] = m[2].replaceAll('&quot;', '"');
					}

					return attrs;
				},
				toBlock: (data) => {
					const parts = [`src="${data.src ?? ''}"`, `alt="${escapeAttr(data.alt)}"`];

					if (data.caption) parts.push(`caption="${escapeAttr(data.caption)}"`);
					parts.push(`width="${data.width || 'column'}"`);
					if (data['source-label']) parts.push(`source-label="${escapeAttr(data['source-label'])}"`);
					if (data['source-url']) parts.push(`source-url="${data['source-url']}"`);

					// Перенос строки по краям — на случай, если блок вставили посреди фразы:
					// без разрыва строки директива читается просто как текст, не как блок.
					return `\n::image{${parts.join(' ')}}\n`;
				},
				toPreview: (data) => `
					<figure style="margin:0">
						<img src="${data.src ?? ''}" alt="${escapeHtml(data.alt)}" style="max-width:100%;border-radius:8px" />
						${data.caption ? `<figcaption style="opacity:0.7;font-size:0.875rem;margin-top:4px">${escapeHtml(data.caption)}</figcaption>` : ''}
					</figure>
				`,
			});
			// Отдельного блока "Галерея" больше нет: несколько блоков "Изображение
			// с подписью" подряд без текста между ними сайт сам собирает в галерею
			// (сетка/карусель) — см. src/plugins/remark-image-figure.mjs. Раньше
			// список картинок внутри своего компонента ненадёжно сохранялся в CMS.

			// Спойлер — два простых маркера вместо одного составного блока: начало
			// и конец, а между ними — обычный текст/картинки редактируются как
			// везде. Разбирает и прячет их src/plugins/remark-spoiler.mjs.
			CMS.registerEditorComponent({
				id: 'spoiler-start',
				label: 'Спойлер: начало',
				icon: 'visibility_off',
				fields: [{ label: 'Текст кнопки', name: 'label', widget: 'string', required: false }],
				pattern: /^::spoiler-start\{([^\n]*)\}$/,
				fromBlock: (match) => {
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[1]))) {
						attrs[m[1]] = m[2].replaceAll('&quot;', '"');
					}

					return attrs;
				},
				toBlock: (data) => `\n::spoiler-start{label="${escapeAttr(data.label || 'Показать спойлер')}"}\n`,
				toPreview: (data) =>
					`<div style="opacity:0.6;font-size:0.875rem">▾ начало спойлера («${escapeHtml(data.label || 'Показать спойлер')}»)</div>`,
			});

			CMS.registerEditorComponent({
				id: 'spoiler-end',
				label: 'Спойлер: конец',
				icon: 'visibility',
				fields: [],
				pattern: /^::spoiler-end\{\}$/,
				fromBlock: () => ({}),
				toBlock: () => '\n::spoiler-end{}\n',
				toPreview: () => `<div style="opacity:0.6;font-size:0.875rem">▴ конец спойлера</div>`,
			});

			// Для одного слова/фразы внутри предложения — без переноса строки, поэтому
			// отдельный синтаксис (один двоеточие вместо двух: :spoiler-inline[...]{}).
			// Экранируем markdown-спецсимволы в тексте, иначе, например, "*" сделает
			// половину фразы курсивом или сломает разбор.
			const escapeMdInline = (value) => String(value ?? '').replace(/([\\`*_[\]])/g, '\\$1');
			const unescapeMdInline = (value) => String(value ?? '').replace(/\\(.)/g, '$1');

			CMS.registerEditorComponent({
				id: 'spoiler-inline',
				label: 'Спойлер (слово/фраза)',
				icon: 'visibility_off',
				fields: [{ label: 'Скрытый текст', name: 'text', widget: 'string' }],
				pattern: /^:spoiler-inline\[((?:\\.|[^\]\\])*)\]\{\}$/,
				fromBlock: (match) => ({ text: unescapeMdInline(match[1]) }),
				toBlock: (data) => `:spoiler-inline[${escapeMdInline(data.text)}]{}`,
				toPreview: (data) => `<span style="opacity:0.6">🔒 ${escapeHtml(data.text)}</span>`,
			});

			// Видео в любом месте текста — YouTube-ссылка или прямая ссылка на свой
			// файл (заливается через Cyberduck на Hetzner, см. тз/04). Заполняйте
			// только одно поле — если заполнены оба, победит YouTube (см. remark-video.mjs).
			CMS.registerEditorComponent({
				id: 'video',
				label: 'Видео',
				icon: 'movie',
				fields: [
					{ label: 'Ссылка на YouTube', name: 'youtube', widget: 'string', required: false },
					{
						label: 'Прямая ссылка на файл (свой видео, залитый на Hetzner)',
						name: 'video',
						widget: 'string',
						required: false,
						hint: 'Заполняйте это ИЛИ ссылку на YouTube выше — не оба сразу.',
					},
				],
				pattern: /^::video\{([^\n]*)\}$/,
				fromBlock: (match) => {
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[1]))) {
						attrs[m[1]] = m[2].replaceAll('&quot;', '"');
					}

					return attrs;
				},
				toBlock: (data) => {
					const attrs = [];
					if (data.youtube) attrs.push(`youtube="${escapeAttr(data.youtube)}"`);
					if (data.video) attrs.push(`video="${escapeAttr(data.video)}"`);
					return `\n::video{${attrs.join(' ')}}\n`;
				},
				toPreview: (data) => {
					if (data.youtube) return `<div style="opacity:0.6">▶ YouTube: ${escapeHtml(data.youtube)}</div>`;
					if (data.video) return `<div style="opacity:0.6">▶ Видео: ${escapeHtml(data.video)}</div>`;
					return `<div style="opacity:0.6">Видео (вставьте ссылку на YouTube или на файл)</div>`;
				},
			});

			// Кнопка «Аниме» — метка тайтла в тексте: :anime[Текст]{id="frieren" source="shikimori" source-id="9253"}.
			// id — slug тайтла в справочнике (src/content/anime/), source/source-id — Shikimori
			// или AniList id, по нему робот на GitHub Actions потом точно (без поиска по названию,
			// значит без риска перепутать похожие тайтлы) добирает данные и обложку — см.
			// scripts/sync-anime.mjs. Сама разметка превращается в ссылку на сайте только для
			// первого упоминания тайтла в посте — это делает src/plugins/remark-anime.mjs.
			//
			// В самом справочнике на этот момент тайтла может ещё не быть — это нормально,
			// его следующим шагом создаст робот. Уже известные тайтлы (public/anime-index.json,
			// собирается при сборке сайта) переиспользуются по source+source-id, чтобы не
			// плодить дубликаты с разными slug на один и тот же тайтл.

			// Транслитерация только для того, чтобы slug из русского названия выглядел
			// читаемо в адресе страницы — на поиск и на выбор тайтла не влияет.
			const CYRILLIC_MAP = {
				а: 'a',
				б: 'b',
				в: 'v',
				г: 'g',
				д: 'd',
				е: 'e',
				ё: 'e',
				ж: 'zh',
				з: 'z',
				и: 'i',
				й: 'y',
				к: 'k',
				л: 'l',
				м: 'm',
				н: 'n',
				о: 'o',
				п: 'p',
				р: 'r',
				с: 's',
				т: 't',
				у: 'u',
				ф: 'f',
				х: 'h',
				ц: 'ts',
				ч: 'ch',
				ш: 'sh',
				щ: 'sch',
				ъ: '',
				ы: 'y',
				ь: '',
				э: 'e',
				ю: 'yu',
				я: 'ya',
			};

			function slugify(text) {
				const transliterated = String(text ?? '')
					.toLowerCase()
					.split('')
					.map((ch) => (ch in CYRILLIC_MAP ? CYRILLIC_MAP[ch] : ch))
					.join('');
				return (
					transliterated
						.normalize('NFD')
						.replace(/[\u0300-\u036f]/g, '')
						.replace(/[^a-z0-9]+/g, '-')
						.replace(/^-+|-+$/g, '')
						.slice(0, 60) || 'anime'
				);
			}

			function getAnimeIndex() {
				if (!window.__animeIndexPromise) {
					window.__animeIndexPromise = fetch('/anime-index.json')
						.then((res) => (res.ok ? res.json() : []))
						.catch(() => []);
				}
				return window.__animeIndexPromise;
			}

			// Свой slug для тайтла, который уже есть в справочнике по source+sourceId —
			// переиспользуем его, а не создаём новый файл на тот же тайтл.
			async function buildAnimeSlug(item) {
				const index = await getAnimeIndex();
				const existing = index.find((entry) => entry.source === item.source && entry.sourceId === item.sourceId);
				if (existing) return existing.id;

				const base = slugify(item.titleOriginal || item.title);
				const taken = new Set(index.map((entry) => entry.id));
				let slug = base;
				let suffix = 1;
				while (taken.has(slug)) {
					suffix += 1;
					slug = `${base}-${suffix}`;
				}
				return slug;
			}

			async function searchShikimori(query) {
				try {
					const res = await fetch(`https://shikimori.io/api/animes?search=${encodeURIComponent(query)}&limit=8`);
					if (!res.ok) return [];
					const data = await res.json();
					return data.map((item) => ({
						source: 'shikimori',
						sourceId: item.id,
						title: item.russian || item.name,
						titleOriginal: item.name,
						year: item.aired_on ? item.aired_on.slice(0, 4) : '',
						poster: item.image?.preview ? `https://shikimori.one${item.image.preview}` : '',
					}));
				} catch {
					return [];
				}
			}

			async function searchAnilist(query) {
				try {
					const gql = `query($q: String) { Page(perPage: 8) { media(search: $q, type: ANIME) {
						id title { romaji } startDate { year } coverImage { medium }
					} } }`;
					const res = await fetch('https://graphql.anilist.co', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ query: gql, variables: { q: query } }),
					});
					if (!res.ok) return [];
					const json = await res.json();
					const list = json.data?.Page?.media ?? [];
					return list.map((item) => ({
						source: 'anilist',
						sourceId: item.id,
						title: item.title.romaji,
						titleOriginal: item.title.romaji,
						year: item.startDate?.year ? String(item.startDate.year) : '',
						poster: item.coverImage?.medium || '',
					}));
				} catch {
					return [];
				}
			}

			// Поле выбора тайтла — свой тип поля (не обычный текст), потому что ищет
			// вживую по Shikimori/AniList, а не по значению из формы. React передан
			// самой Sveltia CMS глобально (h/createClass), без этого поле пришлось бы
			// собирать отдельным шагом сборки — а у нас админка простой статический файл.
			const AnimeSearchControl = createClass({
				getInitialState() {
					const value = this.props.value || {};
					return { query: value.label || '', results: [], loading: false, picked: value.id ? value : null };
				},
				isValid() {
					return this.state.picked ? true : { error: { message: 'Выберите тайтл из списка подсказок' } };
				},
				scheduleSearch(query) {
					clearTimeout(this._timer);
					if (query.trim().length < 2) {
						this.setState({ results: [], loading: false });
						return;
					}
					this._timer = setTimeout(() => this.runSearch(query), 400);
				},
				async runSearch(query) {
					this.setState({ loading: true });
					let results = await searchShikimori(query);
					if (results.length === 0) results = await searchAnilist(query);
					// Запрос мог устареть, пока ждали ответ — не затираем более новый ввод.
					if (this.state.query.trim() === query.trim()) this.setState({ loading: false, results });
				},
				handleQueryChange(e) {
					const query = e.target.value;
					this.setState({ query, picked: null, results: [] });
					this.props.onChange({ label: query, id: '', source: '', sourceId: null });
					this.scheduleSearch(query);
				},
				async handlePick(item) {
					const slug = await buildAnimeSlug(item);
					const value = { label: this.state.query || item.title, id: slug, source: item.source, sourceId: item.sourceId };
					this.setState({ picked: value, results: [] });
					this.props.onChange(value);
				},
				handleReset() {
					this.setState({ picked: null, results: [] });
				},
				render() {
					const { query, results, loading, picked } = this.state;
					const children = [
						h('input', {
							key: 'input',
							id: this.props.forID,
							className: this.props.classNameWrapper,
							type: 'text',
							placeholder: 'Название тайтла (рус. или ориг.)…',
							value: query,
							onChange: this.handleQueryChange,
							style: { width: '100%', marginBottom: '6px', boxSizing: 'border-box' },
						}),
					];

					if (loading) children.push(h('div', { key: 'loading', style: { fontSize: '13px', opacity: 0.7 } }, 'Ищу…'));

					if (!picked && !loading && results.length > 0) {
						children.push(
							h(
								'ul',
								{
									key: 'results',
									style: {
										listStyle: 'none',
										margin: 0,
										padding: 0,
										border: '1px solid #ccc',
										borderRadius: '4px',
										maxHeight: '260px',
										overflowY: 'auto',
									},
								},
								results.map((item, i) =>
									h(
										'li',
										{
											key: i,
											onClick: () => this.handlePick(item),
											style: {
												display: 'flex',
												gap: '8px',
												alignItems: 'center',
												padding: '6px 8px',
												cursor: 'pointer',
												borderBottom: '1px solid #eee',
											},
										},
										item.poster
											? h('img', {
													key: 'poster',
													src: item.poster,
													style: { width: '32px', height: '44px', objectFit: 'cover', borderRadius: '2px', flexShrink: 0 },
												})
											: null,
										h(
											'span',
											{ key: 'label' },
											`${item.title}${item.year ? ` (${item.year})` : ''} — ${item.source === 'shikimori' ? 'Shikimori' : 'AniList'}`,
										),
									),
								),
							),
						);
					}

					if (!picked && !loading && query.trim().length >= 2 && results.length === 0) {
						children.push(h('div', { key: 'empty', style: { fontSize: '13px', opacity: 0.7 } }, 'Ничего не нашлось.'));
					}

					if (picked) {
						children.push(
							h(
								'div',
								{
									key: 'picked',
									style: {
										display: 'flex',
										justifyContent: 'space-between',
										alignItems: 'center',
										gap: '8px',
										padding: '6px 8px',
										background: '#eaf5ea',
										borderRadius: '4px',
										fontSize: '13px',
										color: '#1a1a1a',
									},
								},
								h('span', { key: 'text' }, `✓ ${picked.label} → /anime/${picked.id}`),
								h('button', { key: 'reset', type: 'button', onClick: this.handleReset }, 'Искать другой'),
							),
						);
					}

					return h('div', {}, children);
				},
			});

			const AnimeSearchPreview = createClass({
				render() {
					const value = this.props.value || {};
					return h('span', {}, value.label ? `🎬 ${value.label}` : '');
				},
			});

			CMS.registerFieldType('anime-search', AnimeSearchControl, AnimeSearchPreview);

			CMS.registerEditorComponent({
				id: 'anime',
				label: 'Аниме',
				icon: 'movie_filter',
				fields: [{ label: 'Тайтл', name: 'match', widget: 'anime-search' }],
				pattern: /^:anime\[((?:\\.|[^\]\\])*)\]\{([^\n]*)\}$/,
				fromBlock: (match) => {
					const label = unescapeMdInline(match[1]);
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[2]))) {
						attrs[m[1]] = m[2];
					}

					return {
						match: { label, id: attrs.id || '', source: attrs.source || '', sourceId: attrs['source-id'] ? Number(attrs['source-id']) : null },
					};
				},
				toBlock: (data) => {
					const m = data.match || {};
					if (!m.id) return '';
					return `:anime[${escapeMdInline(m.label)}]{id="${m.id}" source="${m.source}" source-id="${m.sourceId}"}`;
				},
				toPreview: (data) => {
					const m = data.match || {};
					return m.label ? `<span style="opacity:0.75">🎬 ${escapeHtml(m.label)}</span>` : `<span style="opacity:0.5">Аниме (не выбрано)</span>`;
				},
			});

			// Поле «Тайтлы поста» — для тайтлов, которые нельзя поймать разметкой в тексте
			// (другой падеж, упоминание только в подписи к картинке и т. п., см.
			// тз/03-тайтлы.md, п. 3). Показываем только то, что уже выбрано в этом
			// посте (можно убрать крестиком) — списком-чекбоксом ВСЕХ тайтлов
			// справочника когда-то был, но с ростом числа тайтлов на сайте он стал
			// невозможно длинным, поэтому убран. Добавление — та же живая строка
			// поиска по Shikimori/AniList, что и у кнопки «Аниме» в тексте (см.
			// searchShikimori/searchAnilist/buildAnimeSlug выше); если найденный
			// тайтл уже есть в справочнике по source+sourceId, buildAnimeSlug сам
			// переиспользует его id, а не создаст дубликат. При сохранении
			// (см. preSave ниже) по-настоящему новые записи превращаются в id +
			// служебную метку ::anime-ref{} в тексте — без неё робот, который потом
			// донабирает справочник, не будет знать, что за тайтл искать.
			const AnimePickerControl = createClass({
				getInitialState() {
					return { items: toPlainArray(this.props.value), indexList: [], query: '', results: [], loading: false };
				},
				componentDidMount() {
					getAnimeIndex().then((indexList) => this.setState({ indexList }));
				},
				keyOf(item) {
					return typeof item === 'string' ? item : item.id;
				},
				commit(items) {
					this.setState({ items });
					this.props.onChange(items);
				},
				removeItem(id) {
					this.commit(this.state.items.filter((it) => this.keyOf(it) !== id));
				},
				scheduleSearch(query) {
					clearTimeout(this._timer);
					if (query.trim().length < 2) {
						this.setState({ results: [], loading: false });
						return;
					}
					this._timer = setTimeout(() => this.runSearch(query), 400);
				},
				async runSearch(query) {
					this.setState({ loading: true });
					let results = await searchShikimori(query);
					if (results.length === 0) results = await searchAnilist(query);
					if (this.state.query.trim() === query.trim()) this.setState({ loading: false, results });
				},
				handleQueryChange(e) {
					const query = e.target.value;
					this.setState({ query });
					this.scheduleSearch(query);
				},
				async handlePickNew(item) {
					const slug = await buildAnimeSlug(item);
					if (this.state.items.some((it) => this.keyOf(it) === slug)) {
						this.setState({ query: '', results: [] });
						return;
					}
					const pendingItem = { id: slug, source: item.source, sourceId: item.sourceId, label: item.title };

					this.commit([...this.state.items, pendingItem]);
				},
				render() {
					const { items, indexList, query, results, loading } = this.state;

					// по-настоящему нового (ещё не запрошен робот) — из данных поиска.
					const selectedChips = items.map((it) => {

						const label = known ? known.titleRu || known.titleOriginal : typeof it === 'object' ? it.label : id;

						h('input', {
							key: 'search',

							className: this.props.classNameWrapper,
							type: 'text',
							placeholder: 'Искать новый тайтл (Shikimori/AniList)…',
							value: query,
							onChange: this.handleQueryChange,
							style: { width: '100%', boxSizing: 'border-box' },
						}),
						loading ? h('div', { key: 'loading', style: { fontSize: '13px', opacity: 0.7 } }, 'Ищу…') : null,
						!loading && results.length > 0
							? h(
									'ul',
									{
										key: 'results',
										style: {
											listStyle: 'none',
											margin: '4px 0 0',
											padding: 0,
											border: '1px solid #ccc',
											borderRadius: '4px',
											maxHeight: '220px',
											overflowY: 'auto',
										},
									},
									results.map((item, i) =>
										h(
											'li',
											{
												key: i,
												onClick: () => this.handlePickNew(item),
												style: {
													display: 'flex',
													gap: '8px',
													alignItems: 'center',
													padding: '6px 8px',
													cursor: 'pointer',
													borderBottom: '1px solid #eee',
												},
											},
											item.poster
												? h('img', {
														key: 'poster',
														src: item.poster,
														style: { width: '28px', height: '38px', objectFit: 'cover', borderRadius: '2px', flexShrink: 0 },
													})
												: null,
											h(
												'span',
												{ key: 'label' },
												`${item.title}${item.year ? ` (${item.year})` : ''} — ${item.source === 'shikimori' ? 'Shikimori' : 'AniList'}`,
											),
										),

			const AnimePickerPreview = createClass({
				render() {
					const items = toPlainArray(this.props.value);

				},
			});

			CMS.registerFieldType('anime-picker', AnimePickerControl, AnimePickerPreview);

			// Поле «Имена спикеров» (тз/05, шаг 6). Имена голосов вписываются
			// руками и побеждают автоматические. Это же закрывает и перепутанные
			// местами голоса, и гостей — отдельной кнопки «поменять местами»
			// поэтому не нужно.
			//
			// Хранится одной строкой 'speaker_0=Эд; speaker_1=Ксюша': для CMS это
			// обычное текстовое поле, терять в нём нечего. Разбор и сборка строки —
			// точная копия src/lib/speakerNames.mjs (админка отдельная статическая
			// страница и импортировать из src не может). Меняете тут — поправьте
			// и там, иначе сайт и админка перестанут понимать друг друга.
			function parseSpeakerNames(value) {
				const names = {};

				for (const chunk of String(value ?? '').split(';')) {
					const at = chunk.indexOf('=');
					if (at === -1) continue;

					const id = chunk.slice(0, at).trim();
					const name = chunk.slice(at + 1).trim();
					if (id && name) names[id] = name;
				}

				return names;
			}

			function serializeSpeakerNames(names) {
				return Object.entries(names ?? {})
					.filter(([id, name]) => id && String(name ?? '').trim())
					.map(([id, name]) => `${id}=${String(name).trim()}`)
					.join('; ');
			}

			// Данные выпуска для админки: список голосов и подсказки к ним. Готовит
			// сайт при сборке — src/pages/admin-data/[guid].json.ts.
			function getEpisodeAdminData(guid) {
				window.__episodeAdminData = window.__episodeAdminData || {};
				if (!window.__episodeAdminData[guid]) {
					window.__episodeAdminData[guid] = fetch(`/admin-data/${encodeURIComponent(guid)}.json`)
						.then((res) => (res.ok ? res.json() : null))
						.catch(() => null);
				}
				return window.__episodeAdminData[guid];
			}

			// Какая запись сейчас открыта — из адреса страницы админки:
			// #/collections/posts/entries/ep-134 → «ep-134».
			//
			// ВАЖНО, ПОЧЕМУ ТАК, А НЕ ИЗ САМОЙ ЗАПИСИ. Sveltia CMS не передаёт
			// запись в своё поле: приходит ровно { value, field, forID,
			// classNameWrapper, onChange, ref } — проверено по коду CMS.
			// В Decap, по документации которого эти виджеты писались, запись
			// передаётся (props.entry), из-за чего поля сначала были глухими.
			// Прочитать audioGuid из формы тоже нельзя — такого поля на экране
			// нет вовсе, оно не заведено в config.yml.
			//
			// У новой, ещё не сохранённой записи в адресе стоит /new — имени нет,
			// и это правильно: связи с выпуском у неё пока и не может быть.
			function currentEntrySlug() {
				const match = /#\/collections\/[^/]+\/entries\/([^/?#]+)/.exec(window.location.hash);
				return match ? decodeURIComponent(match[1]) : '';
			}

			// Связь «пост → расшифровка», её готовит сайт при сборке
			// (src/pages/admin-posts.json.ts).
			function getPostTranscriptMap() {
				if (!window.__postTranscriptMap) {
					window.__postTranscriptMap = fetch('/admin-posts.json')
						.then((res) => (res.ok ? res.json() : {}))
						.catch(() => ({}));
				}
				return window.__postTranscriptMap;
			}

			// Расшифровка открытого поста, или пустая строка, если её нет.
			async function currentTranscriptId() {
				const slug = currentEntrySlug();
				if (!slug) return '';

				const map = await getPostTranscriptMap();
				return map[slug] ?? '';
			}

			// Общее для трёх полей: дождаться данных выпуска и разложить их
			// по состояниям. Одинаково у всех, чтобы сообщения не разъезжались.
			function loadEpisodeInto(component, hasSection) {
				currentTranscriptId().then((guid) => {
					if (!guid) {
						component.setState({ status: 'no-episode' });
						return;
					}
					getEpisodeAdminData(guid).then((data) =>
						component.setState(data && hasSection(data) ? { data, status: 'ready' } : { status: 'no-transcript' }),
					);
				});
			}

			// Подсказка к голосу: чем человеку отличить один от другого, не слушая
			// выпуск. Роль и высота голоса — то, по чему решала автоматика,
			// а сколько говорил — самый понятный признак «ведущий или гость».
			function describeVoice(speaker, position) {
				const parts = [`Голос ${position}`];

				if (speaker.uncertain) parts.push('автоматика сомневалась');
				else if (speaker.name) parts.push(`сейчас «${speaker.name}»`);

				if (speaker.role === 'host') parts.push('ведущий');
				if (speaker.role === 'guest') parts.push('гость');
				if (speaker.pitchHz) parts.push(`${Math.round(speaker.pitchHz)} Гц`);
				if (speaker.speechSeconds) parts.push(`говорил ${Math.round(speaker.speechSeconds / 60)} мин`);

				return parts.join(' · ');
			}

			const hintStyle = { fontSize: '13px', opacity: 0.7, padding: '4px 0' };

			const SpeakerNamesControl = createClass({

				handleChange(id, raw) {
					// Точка с запятой и знак равенства разделяют пары в строке —
					// в самом имени их быть не может, поэтому вырезаем при вводе.
					const name = String(raw).replace(/[;=]/g, ' ').replace(/\s+/g, ' ').trimStart();
					this.props.onChange(serializeSpeakerNames({ ...parseSpeakerNames(this.props.value), [id]: name }));
				},
				render() {

					if (status === 'no-episode') return h('div', { style: hintStyle }, 'У этого поста нет выпуска с расшифровкой. Если пост создан или привязан к выпуску только что — поле заработает после ближайшей сборки сайта.');
					if (status === 'no-transcript')
						return h(
							'div',
							{ style: hintStyle },
							'Расшифровки у этого выпуска пока нет (либо она добавлена только что — тогда появится после ближайшей сборки сайта).',
						);

					const manual = parseSpeakerNames(this.props.value);

					return h(

						{ id: this.props.forID },
						data.speakers.map((speaker, i) =>

				},
			});

			const SpeakerNamesPreview = createClass({
				render() {
					const names = Object.values(parseSpeakerNames(this.props.value));
					return h('span', {}, names.length > 0 ? names.join(', ') : '');

			CMS.registerFieldType('speaker-names', SpeakerNamesControl, SpeakerNamesPreview);

			// Поле «Исправления названий» (тз/05, шаг 6). Показывает то, что
			// предложил скрипт распознавания, и применяет ТОЛЬКО отмеченное.
			// Галочки сняты по умолчанию не для красоты: на пяти накопившихся
			// файлах из 21 предложения не годилось ни одного (см. подробности
			// в src/lib/nameCorrections.mjs). Молча применять такое нельзя.
			//
			// Разбор и сборка строки — копия src/lib/nameCorrections.mjs,
			// меняете тут — поправьте и там.
			function parseNameCorrections(value) {
				const fixes = [];

				for (const chunk of String(value ?? '').split(';')) {
					const [replica, found, suggested] = chunk.split('|').map((part) => part.trim());
					if (!found || !suggested || !/^\d+$/.test(replica ?? '')) continue;
					fixes.push({ replica: Number(replica), found, suggested });
				}

				return fixes;
			}

			function serializeNameCorrections(fixes) {
				return (fixes ?? [])
					.map(({ replica, found, suggested }) =>
						[replica, found, suggested].map((part) => String(part).replaceAll(';', ' ').replaceAll('|', ' ').trim()).join('|'),
					)
					.join('; ');
			}

			function correctionKey(fix) {
				return `${fix.replica}|${fix.found}|${fix.suggested}`;
			}

			const NameCorrectionsControl = createClass({
				getInitialState() {
					return { data: null, status: 'loading' };
				},
				componentDidMount() {
					loadEpisodeInto(this, (data) => data.corrections);
				},
				applied() {
					return new Set(parseNameCorrections(this.props.value).map(correctionKey));
				},
				toggle(item) {
					const applied = this.applied();
					const key = correctionKey(item);
					// Отмеченные храним в том же порядке, в каком их предложили —
					// так строку в файле поста можно читать глазами.
					const kept = this.state.data.corrections.filter((fix) =>
						correctionKey(fix) === key ? !applied.has(key) : applied.has(correctionKey(fix)),
					);
					this.props.onChange(serializeNameCorrections(kept));
				},
				render() {
					const { data, status } = this.state;

					if (status === 'loading') return h('div', { style: hintStyle }, 'Смотрю, есть ли предложения…');
					if (status === 'no-episode') return h('div', { style: hintStyle }, 'У этого поста нет выпуска с расшифровкой. Если пост создан или привязан к выпуску только что — поле заработает после ближайшей сборки сайта.');
					if (status === 'no-transcript') return h('div', { style: hintStyle }, 'Расшифровки у этого выпуска пока нет.');
					if (data.corrections.length === 0)
						return h('div', { style: hintStyle }, 'Распознавание не нашло похожих на названия мест — исправлять нечего.');

					const applied = this.applied();

					return h(
						'div',
						{ id: this.props.forID },
						h(
							'div',
							{ style: { ...hintStyle, opacity: 1 } },
							`Распознавание нашло ${data.corrections.length} похожих мест · применено ${applied.size}. Отмечайте только настоящие искажения.`,
						),
						data.corrections.map((fix) => {
							const on = applied.has(correctionKey(fix));

							return h(
								'label',
								{
									key: correctionKey(fix),
									style: {
										display: 'flex',
										gap: '8px',
										alignItems: 'flex-start',
										padding: '6px 0',
										borderTop: '1px solid #eee',
										cursor: 'pointer',
										opacity: on ? 1 : 0.75,
									},
								},
								h('input', { type: 'checkbox', checked: on, onChange: () => this.toggle(fix), style: { marginTop: '3px', flexShrink: 0 } }),
								h(
									'span',
									{ style: { fontSize: '13px', lineHeight: 1.45, minWidth: 0, wordBreak: 'break-word' } },
									h('span', { key: 'fix', style: { fontWeight: 600 } }, `«${fix.found}» → «${fix.suggested}»`),
									h(
										'span',
										{ key: 'why', style: { opacity: 0.6 } },
										fix.changesSearch ? '' : ' — разница только в «ё», на поиск не влияет',
									),
									h('br', { key: 'br' }),
									h(
										'span',
										{ key: 'context', style: { opacity: 0.75 } },
										`${fix.context.cutLeft ? '…' : ''}${fix.context.before} `,
										h('mark', { key: 'match' }, fix.context.match),
										` ${fix.context.after}${fix.context.cutRight ? '…' : ''}`,
									),
								),
							);
						}),
					);
				},
			});

			const NameCorrectionsPreview = createClass({
				render() {
					const fixes = parseNameCorrections(this.props.value);
					return h('span', {}, fixes.length > 0 ? `исправлено названий: ${fixes.length}` : '');
				},
			});

			CMS.registerFieldType('name-corrections', NameCorrectionsControl, NameCorrectionsPreview);

			// Поле «Упоминания в транскрипте» (тз/05, шаг 6). Стоит прямо под
			// «Тайтлы поста»: сверху заказчик вводит данные, снизу проверяет
			// автоматику. Объединять их не надо — разная природа.
			//
			// Два уровня: снятая галочка убирает одно упоминание, «Скрыть все»
			// убирает тайтл из выпуска целиком. Убранное НЕ ИСЧЕЗАЕТ из списка,
			// а бледнеет — вернуть можно всегда.
			//
			// Хранится строкой 'monster:* k-on:12,45.1'. Разбор и сборка — копия
			// src/lib/mentionExceptions.mjs, меняете тут — поправьте и там.
			function parseMentionExceptions(value) {
				const hiddenAnime = [];
				const hiddenMentions = [];

				for (const chunk of String(value ?? '').trim().split(/\s+/)) {
					const at = chunk.indexOf(':');
					if (at <= 0) continue;

					const anime = chunk.slice(0, at);
					const anchors = chunk.slice(at + 1);

					if (anchors === '*') {
						hiddenAnime.push(anime);
						continue;
					}

					for (const anchor of anchors.split(',')) {
						const [replica, occurrence = '0'] = anchor.split('.');
						if (!/^\d+$/.test(replica) || !/^\d+$/.test(occurrence)) continue;
						hiddenMentions.push({ anime, replica: Number(replica), occurrence: Number(occurrence) });
					}
				}

				return { hiddenAnime, hiddenMentions };
			}

			function serializeMentionExceptions({ hiddenAnime = [], hiddenMentions = [] } = {}) {
				const whole = new Set(hiddenAnime);
				const byAnime = new Map();

				for (const { anime, replica, occurrence = 0 } of hiddenMentions) {
					if (whole.has(anime)) continue;
					const anchor = occurrence > 0 ? `${replica}.${occurrence}` : String(replica);
					byAnime.set(anime, [...(byAnime.get(anime) ?? []), { replica, occurrence, anchor }]);
				}

				const parts = [...whole].sort().map((anime) => `${anime}:*`);

				for (const anime of [...byAnime.keys()].sort()) {
					const anchors = byAnime
						.get(anime)
						.sort((a, b) => a.replica - b.replica || a.occurrence - b.occurrence)
						.map((item) => item.anchor);
					parts.push(`${anime}:${anchors.join(',')}`);
				}

				return parts.join(' ');
			}

			function sameMention(rule, animeId, mention) {
				return rule.anime === animeId && rule.replica === mention.replica && rule.occurrence === mention.occurrence;
			}

			// Русское склонение к числу: 1 упоминание, 2 упоминания, 5 упоминаний.
			function plural(count, one, few, many) {
				const mod100 = count % 100;
				const mod10 = count % 10;
				if (mod100 >= 11 && mod100 <= 14) return many;
				if (mod10 === 1) return one;
				if (mod10 >= 2 && mod10 <= 4) return few;
				return many;
			}

			const MentionExceptionsControl = createClass({
				getInitialState() {
					// Карточки свёрнуты по умолчанию: раскрывают только тот тайтл,
					// что вызвал сомнение, а не читают весь список подряд.
					return { data: null, status: 'loading', open: {} };
				},
				componentDidMount() {
					loadEpisodeInto(this, (data) => data.anime);
				},
				commit(next) {
					this.props.onChange(serializeMentionExceptions(next));
				},
				toggleMention(animeId, mention) {
					const { hiddenAnime, hiddenMentions } = parseMentionExceptions(this.props.value);
					const already = hiddenMentions.some((rule) => sameMention(rule, animeId, mention));

					this.commit({
						hiddenAnime,
						hiddenMentions: already
							? hiddenMentions.filter((rule) => !sameMention(rule, animeId, mention))
							: [...hiddenMentions, { anime: animeId, replica: mention.replica, occurrence: mention.occurrence }],
					});
				},
				hideWholeTitle(animeId) {
					const { hiddenAnime, hiddenMentions } = parseMentionExceptions(this.props.value);
					// Отдельные якоря этого тайтла больше не нужны — тайтл убран целиком.
					this.commit({
						hiddenAnime: [...hiddenAnime, animeId],
						hiddenMentions: hiddenMentions.filter((rule) => rule.anime !== animeId),
					});
				},
				restoreTitle(animeId) {
					const { hiddenAnime, hiddenMentions } = parseMentionExceptions(this.props.value);
					this.commit({
						hiddenAnime: hiddenAnime.filter((id) => id !== animeId),
						hiddenMentions: hiddenMentions.filter((rule) => rule.anime !== animeId),
					});
				},
				toggleOpen(animeId) {
					this.setState({ open: { ...this.state.open, [animeId]: !this.state.open[animeId] } });
				},
				renderMention(animeId, mention, disabled, hidden) {
					const { context } = mention;

					return h(
						'label',
						{
							key: `${mention.replica}.${mention.occurrence}`,
							style: {
								display: 'flex',
								gap: '8px',
								alignItems: 'flex-start',
								padding: '5px 0',
								cursor: disabled ? 'default' : 'pointer',
								// Скрытое бледнеет, но остаётся в списке — вернуть можно всегда.
								opacity: hidden ? 0.45 : 1,
							},
						},
						h('input', {
							type: 'checkbox',
							checked: !hidden,
							disabled,
							onChange: () => this.toggleMention(animeId, mention),
							style: { marginTop: '3px', flexShrink: 0 },
						}),
						h(
							'span',
							{ style: { fontSize: '13px', lineHeight: 1.45, minWidth: 0, wordBreak: 'break-word' } },
							h('span', { key: 'time', style: { fontFamily: 'monospace', marginRight: '6px' } }, mention.timecode),
							`${context.cutLeft ? '…' : ''}${context.before} `,
							h('mark', { key: 'match' }, context.match),
							` ${context.after}${context.cutRight ? '…' : ''}`,
						),
					);
				},
				render() {
					const { data, status, open } = this.state;

					if (status === 'loading') return h('div', { style: hintStyle }, 'Считаю упоминания…');
					if (status === 'no-episode') return h('div', { style: hintStyle }, 'У этого поста нет выпуска с расшифровкой. Если пост создан или привязан к выпуску только что — поле заработает после ближайшей сборки сайта.');
					if (status === 'no-transcript') return h('div', { style: hintStyle }, 'Расшифровки у этого выпуска пока нет.');
					if (data.anime.length === 0)
						return h('div', { style: hintStyle }, 'В расшифровке не прозвучало ни одного тайтла из справочника.');

					const { hiddenAnime, hiddenMentions } = parseMentionExceptions(this.props.value);
					const wholeHidden = new Set(hiddenAnime);

					const total = data.anime.reduce((sum, item) => sum + item.mentions.length, 0);
					const hiddenCount = data.anime.reduce(
						(sum, item) =>
							sum +
							(wholeHidden.has(item.id)
								? item.mentions.length
								: item.mentions.filter((mention) => hiddenMentions.some((rule) => sameMention(rule, item.id, mention))).length),
						0,
					);

					const summary =
						`Найдено ${total} ${plural(total, 'упоминание', 'упоминания', 'упоминаний')} ` +
						`в ${data.anime.length} ${plural(data.anime.length, 'тайтле', 'тайтлах', 'тайтлах')}` +
						(hiddenCount > 0 ? ` · ${hiddenCount} скрыто` : '') +
						'. Снимите галочку, если название поймалось по ошибке.';

					return h(
						'div',
						{ id: this.props.forID },
						h('div', { key: 'summary', style: { fontSize: '13px', opacity: 0.75, marginBottom: '8px' } }, summary),
						data.anime.map((item) => {
							const whole = wholeHidden.has(item.id);
							const isOpen = Boolean(open[item.id]);

							return h(
								'div',
								{
									key: item.id,
									style: {
										border: '1px solid #ddd',
										borderRadius: '6px',
										padding: '8px 10px',
										marginBottom: '8px',
										opacity: whole ? 0.55 : 1,
									},
								},
								h(
									'div',
									{ key: 'head', style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
									h(
										'button',
										{
											key: 'toggle',
											type: 'button',
											onClick: () => this.toggleOpen(item.id),
											'aria-expanded': isOpen,
											style: {
												flex: '1 1 auto',
												minWidth: 0,
												textAlign: 'left',
												background: 'none',
												border: 'none',
												padding: 0,
												cursor: 'pointer',
												font: 'inherit',
												fontWeight: 600,
												// На телефоне длинное название должно переноситься,
												// а не вылезать за край карточки.
												whiteSpace: 'normal',
												wordBreak: 'break-word',
											},
										},
										`${isOpen ? '▾' : '▸'} ${item.title} · ${item.mentions.length}${whole ? ' — скрыт целиком' : ''}`,
									),
									h(
										'button',
										{
											key: 'whole',
											type: 'button',
											onClick: () => (whole ? this.restoreTitle(item.id) : this.hideWholeTitle(item.id)),
											style: { flexShrink: 0 },
										},
										whole ? 'Вернуть' : 'Скрыть все',
									),
								),
								isOpen
									? h(
											'div',
											{ key: 'list', style: { marginTop: '6px', borderTop: '1px solid #eee', paddingTop: '4px' } },
											item.mentions.map((mention) =>
												this.renderMention(
													item.id,
													mention,
													whole,
													whole || hiddenMentions.some((rule) => sameMention(rule, item.id, mention)),
												),
											),
										)
									: null,
							);
						}),
					);
				},
			});

			const MentionExceptionsPreview = createClass({
				render() {
					const { hiddenAnime, hiddenMentions } = parseMentionExceptions(this.props.value);
					const count = hiddenAnime.length + hiddenMentions.length;
					return h('span', {}, count > 0 ? `скрыто упоминаний: ${count}` : '');
				},
			});

			CMS.registerFieldType('mention-exceptions', MentionExceptionsControl, MentionExceptionsPreview);

			// Поле «Варианты написания» в разделе «Аниме» (тз/05, шаг 6).
			// Хранит обычный список строк — ровно то же, что хранило штатное поле
			// до появления подсказок. Свой компонент нужен только ради кнопок
			// «добавить»: сами данные не усложнились, и если компонент когда-нибудь
			// подведёт, файл справочника читается и обычным полем.
			//
			// ПОДСКАЗКИ НИЧЕГО НЕ ДОБАВЛЯЮТ САМИ. Вариант ищется по 22 575
			// репликам живой речи, и плохой даёт ложные упоминания сразу по всему
			// архиву и молча. Что предлагается и почему — src/lib/aliasHints.mjs.
			function getAliasHints() {
				if (!window.__aliasHintsPromise) {
					window.__aliasHintsPromise = fetch('/anime-alias-hints.json')
						.then((res) => (res.ok ? res.json() : {}))
						.catch(() => ({}));
				}
				return window.__aliasHintsPromise;
			}

			// Сравниваем так же, как ищем упоминания: без учёта регистра
			// и без разницы между «е» и «ё» (src/lib/animeMentions.mjs).
			function foldName(value) {
				return String(value ?? '')
					.toLowerCase()
					.replace(/ё/g, 'е')
					.trim();
			}

			const AliasListControl = createClass({
				getInitialState() {
					return { hints: null, draft: '' };
				},
				componentDidMount() {
					// Имя файла тайтла = его id в справочнике, и оно же стоит
					// в адресе: #/collections/anime/entries/k-on.
					const id = currentEntrySlug();
					getAliasHints().then((all) => this.setState({ hints: all[id] ?? { archive: [], source: [] } }));
				},
				items() {
					return toPlainArray(this.props.value).map((item) => String(item));
				},
				add(value) {
					const name = String(value).trim();
					if (!name) return;

					const items = this.items();
					if (items.some((item) => foldName(item) === foldName(name))) return;
					this.props.onChange([...items, name]);
				},
				remove(name) {
					this.props.onChange(this.items().filter((item) => item !== name));
				},
				handleKeyDown(e) {
					if (e.key !== 'Enter') return;
					// Иначе Enter отправил бы всю форму записи.
					e.preventDefault();
					this.add(this.state.draft);
					this.setState({ draft: '' });
				},
				renderSuggestions(title, list, keyPrefix) {
					if (list.length === 0) return null;

					return h(
						'div',
						{ key: keyPrefix, style: { marginTop: '8px' } },
						h('div', { key: 'title', style: { fontSize: '13px', opacity: 0.7, marginBottom: '4px' } }, title),
						h(
							'div',
							{ key: 'list', style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
							list.map((item) =>
								h(
									'button',
									{
										key: item.label,
										type: 'button',
										onClick: () => this.add(item.value),
										style: { fontSize: '13px', cursor: 'pointer', maxWidth: '100%', whiteSpace: 'normal', textAlign: 'left' },
									},
									`+ ${item.label}`,
								),
							),
						),
					);
				},
				render() {
					const { hints, draft } = this.state;
					const items = this.items();
					const taken = new Set(items.map(foldName));

					const chips = items.map((name) =>
						h(
							'span',
							{
								key: name,
								style: {
									display: 'inline-flex',
									alignItems: 'center',
									gap: '4px',
									padding: '2px 6px',
									marginRight: '6px',
									marginBottom: '6px',
									background: '#eef2f7',
									borderRadius: '4px',
									fontSize: '13px',
									color: '#1a1a1a',
									maxWidth: '100%',
									wordBreak: 'break-word',
								},
							},
							name,
							h(
								'button',
								{ key: 'x', type: 'button', onClick: () => this.remove(name), 'aria-label': `Убрать ${name}`, style: { cursor: 'pointer' } },
								'×',
							),
						),
					);

					const archive = (hints?.archive ?? [])
						.filter((item) => !taken.has(foldName(item.form)))
						.map((item) => ({
							value: item.form,
							label: `${item.form} · ${item.count} ${plural(item.count, 'раз', 'раза', 'раз')}`,
						}));

					const source = (hints?.source ?? [])
						.filter((name) => !taken.has(foldName(name)))
						.map((name) => ({ value: name, label: name }));

					return h(
						'div',
						{},
						chips.length > 0 ? h('div', { key: 'chips', style: { marginBottom: '4px' } }, chips) : null,
						h('input', {
							key: 'draft',
							id: this.props.forID,
							className: this.props.classNameWrapper,
							type: 'text',
							placeholder: 'Ещё вариант — впишите и нажмите Enter',
							value: draft,
							onChange: (e) => this.setState({ draft: e.target.value }),
							onKeyDown: this.handleKeyDown,
							onBlur: () => {
								this.add(draft);
								this.setState({ draft: '' });
							},
							style: { width: '100%', boxSizing: 'border-box' },
						}),
						hints === null ? h('div', { key: 'loading', style: hintStyle }, 'Ищу подсказки…') : null,
						this.renderSuggestions('В архиве звучит так — но пока не ищется:', archive, 'archive'),
						this.renderSuggestions('Shikimori знает такие названия:', source, 'source'),
					);
				},
			});

			const AliasListPreview = createClass({
				render() {
					return h('span', {}, toPlainArray(this.props.value).join(', '));
				},
			});

			CMS.registerFieldType('alias-list', AliasListControl, AliasListPreview);

			function extractAnimeIdsFromBody(body) {
				const ids = [];
				const re = /:anime\[[^\]]*\]\{id="([^"]+)"/g;
				let m;
				while ((m = re.exec(String(body ?? '')))) {
					if (!ids.includes(m[1])) ids.push(m[1]);
				}
				return ids;
			}

			function toPlainArray(value) {
				if (!value) return [];
				if (typeof value.toJS === 'function') return value.toJS();
				return Array.isArray(value) ? value : [];
			}

			// Проверка при сохранении: ищем в тексте (вне уже расставленных меток) названия
			// тайтлов, которые уже есть в справочнике — вдруг упомянули, но забыли отметить
			// кнопкой «Аниме» (см. тз/03-тайтлы.md, п. 5). Ничего не меняет и не блокирует
			// сохранение — только подсказывает, дальше решает автор.
			function stripAnimeMarkers(body) {
				return String(body ?? '').replace(/:anime\[[^\]]*\]\{[^}]*\}/g, ' ');
			}

			async function findUnmarkedKnownTitles(body) {
				const index = await getAnimeIndex();
				const plainText = stripAnimeMarkers(body);
				const found = [];

				for (const entry of index) {
					const names = [entry.titleRu, entry.titleOriginal].filter((name) => name && name.length >= 3);
					if (names.some((name) => plainText.includes(name))) {
						found.push(entry.titleRu || entry.titleOriginal);
					}
				}

				return found;
			}

			// Поле «Тайтлы поста» хранит либо готовые id (строкой), либо, для тайтлов
			// без справочника, объект {id, source, sourceId, label} — из вторых при
			// сохранении собираются служебные метки ::anime-ref{} в тексте (см. выше).
			function splitAnimePickerItems(items) {
				const ids = [];
				const pending = [];
				for (const item of items) {
					if (typeof item === 'string') {
						ids.push(item);
					} else if (item && item.id) {
						ids.push(item.id);
						if (item.source && item.sourceId) pending.push(item);
					}
				}
				return { ids, pending };
			}

			// Раздел «Аниме»: какие поля заказчик правит руками. Отмеченное здесь
			// не перезаписывается данными из Shikimori/AniList — признак по каждому
			// полю отдельно (CLAUDE.md, «Тайтл»), решает scripts/anime-lib.mjs.
			const MANUAL_ANIME_FIELDS = ['titleRu', 'synopsis', 'poster'];

			// Точная копия src/lib/animeFieldHash.mjs — админка это отдельная
			// статическая страница, импортировать из src она не может. Меняете
			// тут — поправьте и там, иначе сравнение перестанет сходиться.
			function fieldHash(value) {
				const text = String(value ?? '').trim();
				let hash = 0x811c9dc5;

				for (let i = 0; i < text.length; i++) {
					hash ^= text.charCodeAt(i);
					hash = Math.imul(hash, 0x01000193) >>> 0;
				}

				return hash.toString(16);
			}

			function getAnimeFieldHashes() {
				if (!window.__animeFieldsPromise) {
					window.__animeFieldsPromise = fetch('/anime-fields.json')
						.then((res) => (res.ok ? res.json() : {}))
						.catch(() => ({}));
				}
				return window.__animeFieldsPromise;
			}

			// Галочку «не обновлять из источника» ставим сами, как только поле
			// поправили: помнить про неё заказчику не нужно, а забытая галочка
			// означала бы, что робот однажды молча затрёт ручную работу.
			// Снять галочку по-прежнему можно руками — например, чтобы обложка
			// снова обновлялась автоматически.
			async function markManualAnimeFields(data) {
				const hashes = await getAnimeFieldHashes();
				const before = hashes[data.get('id')];
				const manual = new Set(toPlainArray(data.get('manual')));

				// Слепков нет — тайтл появился уже после последней сборки сайта.
				// Тогда не помечаем ничего: лучше не заметить правку (её отметит
				// следующее сохранение), чем заморозить поле, которого не касались.
				for (const field of MANUAL_ANIME_FIELDS) {
					if (before && before[field] !== fieldHash(data.get(field))) manual.add(field);
				}

				return data.set('manual', [...manual]);
			}

			CMS.registerEventListener({
				name: 'preSave',
				handler: async ({ entry }) => {
					const data = entry.get('data');

					// Тайтл справочника отличаем от поста по его собственным полям.
					// Всё, что ниже, — про посты, и запись справочника через это
					// гнать нельзя: в JSON тайтла улетело бы чужое поле «anime».
					if (data.get('sourceId') !== undefined && data.get('titleOriginal') !== undefined) {
						return await markManualAnimeFields(data);
					}

					let body = data.get('body') ?? '';

					const unmarked = await findUnmarkedKnownTitles(body);
					if (unmarked.length > 0) {
						window.alert(
							`Похоже, в тексте упомянут${unmarked.length === 1 ? '' : 'ы'} тайтл${unmarked.length === 1 ? '' : 'ы'} без разметки: ${unmarked.join(', ')}.\n\nЕсли забыли — отметьте кнопкой «Аниме», иначе на них не будет ссылки и плашки под постом.`,
						);
					}

					const { ids: manualIds, pending } = splitAnimePickerItems(toPlainArray(data.get('anime')));
					for (const item of pending) {
						body += `\n\n::anime-ref{id="${item.id}" source="${item.source}" source-id="${item.sourceId}"}`;
					}

					const fromText = extractAnimeIdsFromBody(body);
					const merged = [...fromText, ...manualIds.filter((id) => !fromText.includes(id))];

					let newData = data.set('anime', merged);
					if (pending.length > 0) newData = newData.set('body', body);
					return newData;
				},
			});
		</script>
	</body>
</html>
