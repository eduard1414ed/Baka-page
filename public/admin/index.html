<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Админка — Бака!</title>
		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
		<script type="module">
			// Кавычка ломает разбор синтаксиса блока ::image{...}, поэтому в записанном
			// в файл тексте её заменяют на &quot;. Обратную замену делает плагин
			// src/plugins/remark-image-figure.mjs — при изменении логики поправить и там, и там.
			const escapeAttr = (value) => String(value ?? '').replaceAll('"', '&quot;');
			const escapeHtml = (value) =>
				String(value ?? '')
					.replaceAll('&', '&amp;')
					.replaceAll('<', '&lt;')
					.replaceAll('>', '&gt;')
					.replaceAll('"', '&quot;');
			// UTF-8-совместимые base64: обычный btoa/atob не умеют в кириллицу напрямую.
			const toBase64Utf8 = (value) => btoa(unescape(encodeURIComponent(value)));
			const fromBase64Utf8 = (value) => decodeURIComponent(escape(atob(value)));

			CMS.registerEditorComponent({
				// id отдельно от синтаксиса ::image{...} в тексте — так называется только
				// сама кнопка/пункт в CMS. Встроенный простой блок картинки уже занял id "image".
				id: 'figure',
				label: 'Изображение с подписью',
				icon: 'image',
				fields: [
					{ label: 'Файл', name: 'src', widget: 'image' },
					{ label: 'Альт-текст (для незрячих и поиска)', name: 'alt', widget: 'string' },
					{ label: 'Подпись под картинкой', name: 'caption', widget: 'string', required: false },
					{
						label: 'Ширина',
						name: 'width',
						widget: 'select',
						options: [
							{ label: 'В колонку', value: 'column' },
							{ label: 'Во всю ширину', value: 'full' },
						],
						default: 'column',
					},
					{ label: 'Текст ссылки на источник', name: 'source-label', widget: 'string', required: false },
					{ label: 'Ссылка на источник', name: 'source-url', widget: 'string', required: false },
				],
				pattern: /^::image\{([\s\S]*)\}$/,
				fromBlock: (match) => {
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[1]))) {
						attrs[m[1]] = m[2].replaceAll('&quot;', '"');
					}

					return attrs;
				},
				toBlock: (data) => {
					const parts = [`src="${data.src ?? ''}"`, `alt="${escapeAttr(data.alt)}"`];

					if (data.caption) parts.push(`caption="${escapeAttr(data.caption)}"`);
					parts.push(`width="${data.width || 'column'}"`);
					if (data['source-label']) parts.push(`source-label="${escapeAttr(data['source-label'])}"`);
					if (data['source-url']) parts.push(`source-url="${data['source-url']}"`);

					return `::image{${parts.join(' ')}}`;
				},
				toPreview: (data) => `
					<figure style="margin:0">
						<img src="${data.src ?? ''}" alt="${escapeHtml(data.alt)}" style="max-width:100%;border-radius:8px" />
						${data.caption ? `<figcaption style="opacity:0.7;font-size:0.875rem;margin-top:4px">${escapeHtml(data.caption)}</figcaption>` : ''}
					</figure>
				`,
			});

			CMS.registerEditorComponent({
				id: 'gallery',
				label: 'Галерея',
				icon: 'photo_library',
				fields: [
					{
						label: 'Картинки',
						name: 'images',
						widget: 'list',
						fields: [
							{ label: 'Файл', name: 'src', widget: 'image' },
							{ label: 'Альт-текст', name: 'alt', widget: 'string', required: false },
						],
					},
					{ label: 'Общая подпись', name: 'caption', widget: 'string', required: false },
				],
				pattern: /^::gallery\{([\s\S]*)\}$/,
				fromBlock: (match) => {
					const attrs = {};
					const re = /([\w-]+)="((?:[^"])*)"/g;
					let m;

					while ((m = re.exec(match[1]))) {
						attrs[m[1]] = m[2];
					}

					let images = [];

					if (attrs.items) {
						try {
							images = JSON.parse(fromBase64Utf8(attrs.items));
						} catch {
							images = [];
						}
					}

					return { caption: attrs.caption ? attrs.caption.replaceAll('&quot;', '"') : '', images };
				},
				toBlock: (data) => {
					const images = (data.images || [])
						.filter((item) => item && item.src)
						.map((item) => ({ src: item.src, alt: item.alt || '' }));
					const itemsB64 = toBase64Utf8(JSON.stringify(images));

					return `::gallery{caption="${escapeAttr(data.caption)}" items="${itemsB64}"}`;
				},
				toPreview: (data) => {
					const thumbs = (data.images || [])
						.map(
							(item) =>
								`<img src="${item.src ?? ''}" alt="${escapeHtml(item.alt)}" style="width:72px;height:72px;object-fit:cover;border-radius:6px;margin:2px" />`,
						)
						.join('');

					return `
						<div>${thumbs}</div>
						${data.caption ? `<div style="opacity:0.7;font-size:0.875rem;margin-top:4px">${escapeHtml(data.caption)}</div>` : ''}
					`;
				},
			});
		</script>
	</body>
</html>
