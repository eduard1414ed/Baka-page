backend:
  name: github
  repo: eduard1414ed/Baka-page
  branch: main
  base_url: https://baki-cms-auth.eduard1414ed.workers.dev

site_url: https://baka-page.eduard1414ed.workers.dev

# Обязательное поле для CMS — куда класть загруженные картинки.
# Кладём в public, чтобы обычная картинка в тексте (![]()) сразу была
# доступна по прямой ссылке — без этого получается 404.
media_folder: public/images/uploads
public_folder: /images/uploads

# Русские заголовки переводим в латиницу для адреса файла (например
# «Тестовый пост» → «testovyy-post»), иначе имя файла станет нечитаемым.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: Посты
    label_singular: Пост
    folder: src/content/posts
    create: true
    format: frontmatter
    extension: md
    # Пометка в общем списке постов: «· черновик» — обычный черновик,
    # «· черновик ⏰ 12.09, 10:00» — запланирован, без пометок — уже вышел.
    # См. тз/09-отложенный-постинг.md.
    summary: "{{title}}{{fields.draft | ternary(' · черновик', '')}}{{fields.publishAt | date('[ ⏰ ]DD.MM, HH:mm')}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Дата
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
      - label: Категория
        name: category
        widget: select
        options:
          - { label: Подкаст, value: podcast }
          - { label: Видеоэссе, value: videoessay }
          - { label: Заметка, value: note }
          - { label: Обзор, value: review }
          - { label: Бонус, value: bonus }
      - { label: Черновик, name: draft, widget: boolean, default: true }
      - label: Когда опубликовать
        name: publishAt
        widget: datetime
        required: false
        # Явно задаём часовой пояс Берлина — иначе время сохранялось бы либо
        # в часовом поясе браузера (не всегда предсказуемо), либо терялось бы
        # при сборке на сервере в UTC (см. тз/09, пункт про часовой пояс).
        input_timezone: Europe/Berlin
        output_utc: true
        hint: >-
          Время — по Берлину (как на ваших часах). Пусто — пост выходит сразу, как
          только снимете галочку «Черновик» выше. Если время стоит — галочку «Черновик»
          снимать самому не нужно: робот сам снимет её, когда время наступит (точность —
          пара минут). Дата в прошлом — пост выйдет при ближайшей проверке робота, без
          ошибок. Чтобы отменить публикацию — сотрите время, пост останется черновиком.
      - label: Тайтлы поста (вручную)
        name: anime
        widget: anime-picker
        required: false
        hint: >-
          Обычно ничего вписывать не нужно — тайтлы, отмеченные кнопкой «Аниме» в тексте,
          подставляются сюда сами при сохранении. Добавляйте вручную только то, что не
          в тексте (упомянуто в другом падеже, только в подписи к картинке и т. п.) —
          можно выбрать из уже известных или найти новый тайтл прямо тут.
      # Стоит прямо под «Тайтлы поста» и в той же секции: сверху вводятся
      # данные, снизу проверяется автоматика. Объединять в одно поле не надо —
      # разная природа (тз/05, шаг 6).
      - label: Упоминания в транскрипте
        name: mentionsHidden
        widget: mention-exceptions
        required: false
      - label: Имена спикеров
        name: speakers
        widget: speaker-names
        required: false
        hint: >-
          Пусто — остаётся имя, которое проставила автоматика. Вписанное здесь
          побеждает и меняется сразу во всём выпуске. Так же исправляются
          перепутанные местами голоса: просто впишите имена наоборот. Сам файл
          расшифровки при этом не трогается, стёрли строку — вернулось как было.
      - label: Исправления названий
        name: corrections
        widget: name-corrections
        required: false
        hint: >-
          Что распознавание услышало похоже на название из справочника. Ничего
          не применяется само — отмечайте только настоящие искажения («Фринен»
          вместо «Фрирен»). Падеж («Ходячего замка») исправлять тут не нужно
          и вредно: фраза станет безграмотной, а чтобы упоминание нашлось,
          впишите падеж в «Варианты написания» у самого тайтла, в разделе
          «Аниме». Сам файл расшифровки не меняется, галочку всегда можно снять.
      # Готовый сценарий выпуска (тз/05, шаг 7). Загружать можно когда угодно —
      # хоть до выхода выпуска, хоть через неделю после: робот на каждом прогоне
      # проверяет условие «есть расшифровка + есть сценарий + сопоставление
      # не делалось», а не порядок действий автора.
      #
      # media_folder ведёт в scripts/essay — туда же, где лежат 34 сценария
      # архива. Это не public/, поэтому файл сценария не попадает на сайт
      # и не занимает место в лимите файлов Cloudflare.
      - label: Сценарий
        name: script
        widget: file
        required: false
        media_folder: /scripts/essay
        public_folder: /scripts/essay
        hint: >-
          Только для выпусков, начитанных по готовому тексту (эссе, «Врата аниме»).
          Выгрузите сценарий из Google Docs в Markdown и загрузите файл сюда —
          в расшифровке текст заменится на ваш, а время останется из звука.
          Можно в любой момент: до выхода выпуска или через неделю после, робот
          подхватит сам в ближайшую ночь. Поправите файл — пересопоставит заново,
          это бесплатно. Обычным выпускам подкаста поле не нужно.
      - label: Кнопки
        name: buttons
        widget: list
        required: false
        fields:
          - { label: Подпись, name: label, widget: string }
          - { label: Ссылка, name: url, widget: string }
          - label: Стиль
            name: style
            widget: select
            options:
              - { label: Основная, value: primary }
              - { label: Второстепенная, value: secondary }
            default: secondary
      - label: Текст
        name: body
        widget: richtext
        # Встроенный простой блок картинки (id "image") убран специально: он не умеет
        # ни подпись, ни альт-текст, ни группировку в галерею — путал с нашим "figure".
        editor_components: [code-block, figure, video, spoiler-start, spoiler-end, spoiler-inline, anime]

  # Справочник тайтлов. Здесь правятся руками четыре вещи: русское название,
  # описание, обложка и варианты написания (см. CLAUDE.md, раздел «Тайтл»).
  # Заодно эта полка нужна полю «Тайтлы поста» выше, чтобы искать по ней.
  #
  # Создание новых тайтлов отсюда выключено (create: false): каждый новый тайтл —
  # это ещё и скачанная и сжатая обложка, а это умеет делать только кнопка
  # «Аниме» в тексте (робот на GitHub донабирает данные) или
  # scripts/fetch-anime.mjs, но не сама CMS.
  - name: anime
    label: Аниме
    label_singular: Тайтл
    folder: src/content/anime
    create: false
    delete: false
    format: json
    extension: json
    summary: '{{titleRu}} ({{titleOriginal}})'
    fields:
      - label: ID (slug, часть адреса /anime/…)
        name: id
        widget: string
        hint: 'Не меняйте — это часть адреса страницы, правка тут файл не переименует и сломает ссылки.'
      - label: Источник данных
        name: source
        widget: select
        options: [shikimori, anilist]
      - { label: ID в источнике, name: sourceId, widget: number, value_type: int }
      - label: Русское название
        name: titleRu
        widget: string
        required: false
        hint: >-
          Правьте смело: у тайтлов из AniList русского названия не бывает вовсе,
          да и Shikimori иногда даёт не тот перевод, к которому все привыкли.
      - { label: Оригинальное название, name: titleOriginal, widget: string }
      - label: Варианты написания
        name: aliases
        widget: alias-list
        required: false
        hint: >-
          По этим словам упоминания в расшифровках ищутся наравне с названием:
          падежи («Ходячего замка»), то, как тайтл называют вслух («K-On!»
          вместо «Кэйон!»), и то, как его коверкает распознавание («Фринен»).
          Вписанное один раз ловится сразу во всём архиве и во всех будущих
          выпусках, заново распознавать ничего не нужно. Ниже подсказки — что
          реально звучит в архиве и что знает Shikimori; само ничего
          не добавляется. Не берите короткие обычные слова: поймается вся речь.
      - { label: Год, name: year, widget: number, required: false, value_type: int }
      - { label: Студия, name: studio, widget: string, required: false }
      - { label: Обложка (путь в public/anime/), name: poster, widget: string, required: false }
      - { label: Описание, name: synopsis, widget: text, required: false }
      - { label: Ссылка на источник, name: url, widget: string, required: false }
      - label: Не обновлять из Shikimori/AniList
        name: manual
        widget: select
        multiple: true
        required: false
        options:
          - { label: Русское название, value: titleRu }
          - { label: Описание, value: synopsis }
          - { label: Обложка, value: poster }
        hint: >-
          Отмеченное здесь считается вашим: при обновлении данных из источника
          такое поле не перезаписывается. Ставить галочки самому обычно не нужно —
          админка отмечает поле сама, как только вы его поправите. Снимите
          галочку, если передумали и хотите снова получать это поле из источника
          (например, обложку).
