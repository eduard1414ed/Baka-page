backend:
  name: github
  repo: eduard1414ed/Baka-page
  branch: main
  base_url: https://baki-cms-auth.eduard1414ed.workers.dev

site_url: https://bakapodcast.com

# Обязательное поле для CMS — куда класть загруженные картинки.
# Кладём в public, чтобы обычная картинка в тексте (![]()) сразу была
# доступна по прямой ссылке — без этого получается 404.
media_folder: public/images/uploads
public_folder: /images/uploads

# Русские заголовки переводим в латиницу для адреса файла (например
# «Тестовый пост» → «testovyy-post»), иначе имя файла станет нечитаемым.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: Посты
    label_singular: Пост
    folder: src/content/posts
    create: true
    format: frontmatter
    extension: md
    # Пометка в общем списке постов: «· черновик» — обычный черновик,
    # «· черновик ⏰ 12.09, 10:00» — запланирован, без пометок — уже вышел.
    # См. тз/09-отложенный-постинг.md.
    summary: "{{title}}{{fields.draft | ternary(' · черновик', '')}}{{fields.publishAt | date('[ ⏰ ]DD.MM, HH:mm')}}"
    fields:
      # ПОРЯДОК ПОЛЕЙ — часть работы редактора, а не мелочь. Сверху то, что
      # заполняется у каждого поста и почти в одном и том же порядке: заголовок,
      # дата, категория, черновик, время выхода — и сразу текст. Всё, что нужно
      # изредка (обложка, чужой сайт, тайтлы, спикеры, сценарий, кнопки), уехало
      # под текст: пролистывать десять полей до окна ввода при каждой заметке
      # не должен никто.
      - { label: Заголовок, name: title, widget: string }
      - label: Дата
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
      - label: Категория
        name: category
        widget: select
        options:
          - { label: Подкаст, value: podcast }
          - { label: Видеоэссе, value: videoessay }
          - { label: Заметка, value: note }
          - { label: Статья, value: article }
          # Бонус остаётся в списке, хотя своего раздела на сайте у него нет:
          # такие посты показываются вместе с выпусками (см. content.config.ts).
          - { label: Бонус, value: bonus }
      # ЗДЕСЬ БЫЛА ГАЛОЧКА «КАТЕГОРИЮ УГАДАЛ РОБОТ», и её убрали 10 августа 2026.
      # Она появилась ради правила этапа 7 «категория предлагается, а не
      # проставляется молча». Правило осталось, а галочка стала лишней в тот
      # день, когда догадка про видеоэссе была отменена: у всех привезённых
      # постов категория одна и та же, «Заметка», и угадывать больше нечего.
      # Роль «человек это ещё не подтвердил» держит сама галочка «Черновик» —
      # ни один такой пост не попадает на сайт, пока его не открыли руками.
      # Обложка — для ЛЕНТЫ и для превью, когда ссылку кидают в чат.
      # На самой странице поста она не показывается: там картинка уже есть
      # (обложка выпуска в тексте, кадр в статье, плеер ютюба у видеоэссе).
      - { label: Черновик, name: draft, widget: boolean, default: true }
      - label: Когда опубликовать
        name: publishAt
        widget: datetime
        required: false
        # Явно задаём часовой пояс Берлина — иначе время сохранялось бы либо
        # в часовом поясе браузера (не всегда предсказуемо), либо терялось бы
        # при сборке на сервере в UTC (см. тз/09, пункт про часовой пояс).
        input_timezone: Europe/Berlin
        output_utc: true
        hint: >-
          Время — по Берлину (как на ваших часах). Пусто — пост выходит сразу, как
          только снимете галочку «Черновик» выше. Если время стоит — галочку «Черновик»
          снимать самому не нужно: робот сам снимет её, когда время наступит (точность —
          пара минут). Дата в прошлом — пост выйдет при ближайшей проверке робота, без
          ошибок. Чтобы отменить публикацию — сотрите время, пост останется черновиком.
      - label: Текст
        name: body
        widget: richtext
        # Встроенный простой блок картинки (id "image") убран специально: он не умеет
        # ни подпись, ни альт-текст, ни группировку в галерею — путал с нашим "figure".
        #
        # ЭТОТ СПИСОК ОБЯЗАТЕЛЕН ДЛЯ КАЖДОЙ НОВОЙ КНОПКИ. Пока он задан, Sveltia
        # показывает в меню ТОЛЬКО перечисленное здесь: зарегистрировать кнопку
        # в index.html мало, её надо ещё вписать сюда. Забудете — кнопки просто
        # не будет, и никакой ошибки при этом не появится.
        editor_components: [code-block, figure, video, block-label, link-row, spoiler-start, spoiler-end, spoiler-inline, anime]
      # Своё описание материала. Пусто — сайт берёт первый осмысленный абзац
      # текста, как было всегда. Заполнено — побеждает сразу в четырёх местах:
      # подводка на карточке, описание для поисковика, превью ссылки в чате
      # и лента RSS. Одно поле на все четыре намеренно: два описания одного
      # материала однажды разъедутся.
      - label: Описание для карточки и превью
        name: description
        widget: text
        required: false
        hint: >-
          Необязательно. Пусто — сайт возьмёт первый абзац текста; обычно этого
          хватает. Заполняйте, когда первый абзац начинается издалека или когда
          в карточке хочется другую фразу. Показывается в ленте, в поиске
          и в превью ссылки, когда её кидают в чат. Держитесь примерно
          160 знаков — столько показывает поисковик, длинное он обрежет сам.
          Спойлеров тут быть не должно: это описание видно ДО открытия поста.
      - label: Обложка для ленты и соцсетей
        name: cover
        widget: image
        required: false
        hint: >-
          Необязательно. Пусто — сайт возьмёт первую картинку из текста, а у
          выпуска обложку с хостинга подкаста; этого обычно достаточно. Ставьте
          сами в двух случаях: картинки в тексте нет вовсе (видеоэссе, где
          только плеер ютюба) или первая картинка неудачная — тогда нажмите
          сюда и выберите из уже загруженных ту, которая нужна. На странице
          поста эта картинка не появится, только в ленте и в превью.
      - label: Без обложки
        name: noCover
        widget: boolean
        default: false
        required: false
        hint: >-
          Галочка — и в ленте пост будет без картинки вообще, одним заголовком.
          Для коротких заметок. Это не то же самое, что пустое поле выше: пустое
          означает «подбери сам», галочка — «картинки быть не должно». В превью
          для чата картинка всё равно останется — из текста поста, а если
          картинок нет, общая картинка сайта: ссылка совсем без картинки
          выглядит сломанной.
      # Пост-ссылка на чужой сайт (тз/10, задача 2). Это ПРИЗНАК, а не категория:
      # работает поверх любой, обычно поверх «Статьи». Заполнили адрес — своей
      # страницы у поста на сайте не создаётся вовсе.
      - label: Статья на чужом сайте
        name: externalUrl
        widget: string
        required: false
        # Ловим опечатку здесь, а не при сборке. Схема сайта тоже требует
        # настоящий адрес (optionalUrl в src/content.config.ts), но там
        # «kinopoisk.ru/…» без https:// роняет сборку ВСЕГО сайта — проверено.
        # Пусть лучше CMS не даст сохранить, чем сайт ляжет от одной буквы.
        #
        # ПУСТОТА РАЗРЕШЕНА В САМОМ ВЫРАЖЕНИИ (`^$|`), и убирать её нельзя.
        # Sveltia проверяет pattern ВСЕГДА, на любом значении, — «необязательное»
        # на это не влияет никак (это отдельная проверка). Без `^$|` поле
        # становится обязательным по побочному действию: пустой пост не
        # сохранить, и написано при этом «адрес должен начинаться с https://».
        pattern: ['^$|^https?://.+', 'Адрес должен начинаться с https:// — скопируйте его целиком из адресной строки']
        hint: >-
          Адрес вашей статьи на Кинопоиске, в Т—Ж и где угодно ещё. Заполните —
          и карточка в ленте будет открывать этот адрес в новой вкладке, а своей
          страницы на сайте у поста НЕ появится: текста-то у нас нет, страница
          вышла бы пустой. Короткое описание напишите в текст поста или в поле
          «Описание для карточки» — оно покажется в ленте и в поиске. Обычным
          постам поле не нужно, оставьте пустым.
      - label: Название площадки
        name: externalSource
        widget: string
        required: false
        hint: >-
          Что написано рядом с датой: «8 августа 2026 · Кинопоиск». Пусто — сайт
          подставит сам по адресу выше (Кинопоиск, Т—Ж, DTF и другие известные
          он знает, незнакомый покажет доменом). Впишите своё, если подставилось
          не то. Времени чтения у таких постов нет намеренно: считать его
          по описанию — врать читателю, самого текста у нас нет.
      # Маркировка рекламы (тз/10.7). Отдельным полем, а не строкой в тексте:
      # так её не сломать правкой текста и не отправить случайно в поиск.
      #
      # ПРОВЕРКИ ФОРМАТА ЗДЕСЬ НЕТ НАРОЧНО. Что писать, диктует рекламодатель,
      # формулировки у всех разные, и любой pattern рано или поздно не пустил бы
      # верную строку. А заодно: Sveltia проверяет pattern ВСЕГДА, в том числе
      # на пустом значении, — необязательное поле с проверкой становится
      # обязательным по побочному действию (см. соседнее поле «Статья на чужом
      # сайте», где пустота разрешена прямо в выражении).
      - label: Маркировка рекламы
        name: adLabel
        widget: string
        required: false
        hint: >-
          Строка, которую требует закон: «Реклама. ООО «ИЗДАТЕЛЬСТВО «ЭКСМО»,
          ИНН 7708188426, erid: LjN8JuJd5». Скопируйте её у рекламодателя
          целиком, вместе с erid и его буквами — заглавные и строчные в коде
          различаются, и сайт их не меняет. На широком экране строка встанет
          мелким серым текстом справа от текста материала, на телефоне —
          перед текстом. В поиск по сайту, в описание для поисковика и в превью
          ссылки она не попадает, в карточке в ленте не показывается.
          Пост не рекламный — оставьте пустым, тогда блока не будет вовсе.
      - label: Тайтлы поста (вручную)
        name: anime
        widget: anime-picker
        required: false
        hint: >-
          Обычно ничего вписывать не нужно — тайтлы, отмеченные кнопкой «Аниме» в тексте,
          подставляются сюда сами при сохранении. Добавляйте вручную только то, что не
          в тексте (упомянуто в другом падеже, только в подписи к картинке и т. п.) —
          можно выбрать из уже известных или найти новый тайтл прямо тут.
      # Подсказка от импорта, а не данные. Разметку тайтлов делает человек;
      # разбор телеграма только называет то, что узнал в тексте, — и складывает
      # сюда, а не в поле выше. Молча размечать нельзя: плохое совпадение
      # разъехалось бы по всему архиву сразу и незаметно.
      - label: Тайтлы, найденные в тексте (подсказка)
        name: animeSuggested
        widget: list
        required: false
        field: { label: Ключ тайтла, name: id, widget: string }
        hint: >-
          Заполняется только импортом из телеграма. Это НЕ разметка: на странице
          эти тайтлы не появятся. Разметьте нужные кнопкой «Аниме» прямо в тексте
          и очистите список — так вы всегда знаете, что уже проверено.
      # Стоит прямо под «Тайтлы поста» и в той же секции: сверху вводятся
      # данные, снизу проверяется автоматика. Объединять в одно поле не надо —
      # разная природа (тз/05, шаг 6).
      - label: Упоминания в транскрипте
        name: mentionsHidden
        widget: mention-exceptions
        required: false
      - label: Имена спикеров
        name: speakers
        widget: speaker-names
        required: false
        hint: >-
          Пусто — остаётся имя, которое проставила автоматика. Вписанное здесь
          побеждает и меняется сразу во всём выпуске. Так же исправляются
          перепутанные местами голоса: просто впишите имена наоборот. Сам файл
          расшифровки при этом не трогается, стёрли строку — вернулось как было.
      - label: Исправления названий
        name: corrections
        widget: name-corrections
        required: false
        hint: >-
          Что распознавание услышало похоже на название из справочника. Ничего
          не применяется само — отмечайте только настоящие искажения («Фринен»
          вместо «Фрирен»). Падеж («Ходячего замка») исправлять тут не нужно
          и вредно: фраза станет безграмотной, а чтобы упоминание нашлось,
          впишите падеж в «Варианты написания» у самого тайтла, в разделе
          «Аниме». Сам файл расшифровки не меняется, галочку всегда можно снять.
      # Готовый сценарий выпуска (тз/05, шаг 7). Загружать можно когда угодно —
      # хоть до выхода выпуска, хоть через неделю после: робот на каждом прогоне
      # проверяет условие «есть расшифровка + есть сценарий + сопоставление
      # не делалось», а не порядок действий автора.
      #
      # media_folder ведёт в scripts/essay — туда же, где лежат 34 сценария
      # архива. Это не public/, поэтому файл сценария не попадает на сайт
      # и не занимает место в лимите файлов Cloudflare.
      - label: Сценарий
        name: script
        widget: file
        required: false
        media_folder: /scripts/essay
        public_folder: /scripts/essay
        hint: >-
          Только для выпусков, начитанных по готовому тексту (эссе, «Врата аниме»).
          Выгрузите сценарий из Google Docs в Markdown и загрузите файл сюда —
          в расшифровке текст заменится на ваш, а время останется из звука.
          Можно в любой момент: до выхода выпуска или через неделю после, робот
          подхватит сам в ближайшую ночь. Поправите файл — пересопоставит заново,
          это бесплатно. Обычным выпускам подкаста поле не нужно.
      # Оглавление выпуска (тз/08, 9.3). ОДНО ПОЛЕ, А НЕ СПИСОК ПАР.
      # Список был первым решением, и он же оказался неудобным: десять тем —
      # десять нажатий «добавить» и двадцать переходов между полями, а список
      # обычно уже написан и лежит в шоунотах. Теперь его вставляют целиком,
      # а разбирает сайт при сборке (src/lib/timecode.mjs).
      #
      # Проверки формата у поля нет намеренно: она отвергала бы вставку
      # с лишней строкой вроде «Таймкоды:», то есть ровно то, ради чего поле
      # и заведено. Непонятные строки просто не показываются, и сборка
      # называет каждую в логе.
      - label: Таймкоды
        name: timecodes
        widget: text
        required: false
        hint: >-
          Оглавление выпуска — по строке на тему, «12:04 — Тема». Вставляйте
          прямо из шоунотов: тире между временем и темой можно любое или совсем
          без него, лишняя строка «Таймкоды:» сверху не помешает. Больше часа
          пишется как 1:02:11. Пусто — блока на странице не будет, а таймкоды,
          написанные прямо в тексте, работают как работали.
      # ▲▼ ВТОРАЯ КОПИЯ СОСТАВА ПЛОЩАДОК ПОДДЕРЖКИ. ▼▲
      #
      # Первая — `src/data/platforms.js`, записи с `kind: 'support'`. Имена
      # строк (`boosty`, `patreon`, `tgClosed`, `vkDonat`) обязаны совпадать
      # с полем `id` там. МЕНЯЕТЕ СОСТАВ ТАМ — ПОПРАВЬТЕ И ЗДЕСЬ: этот файл
      # статичен и спросить platforms.js не умеет, поэтому новая площадка
      # появится на сайте, но строки для неё в админке не будет.
      #
      # Каждая строка — ЗАМЕНА, а не список: пусто значит «взять общий адрес»,
      # и копии адреса в посте не возникает.
      #
      # `pattern` проверяется ВСЕГДА, в том числе на пустом значении, —
      # `required: false` на это не влияет. Поэтому пустая строка разрешена
      # в самом выражении (`^$|…`), иначе поле стало бы обязательным
      # по побочному действию.
      - label: Ссылки площадок
        name: bonusLinks
        widget: object
        required: false
        collapsed: true
        hint: >-
          Только для категории «Бонус». По строке на каждую площадку поддержки:
          пусто — на кнопке будет общий адрес площадки, как в подвале и на
          странице «Поддержать». Заполните, если у ЭТОГО бонуса своя ссылка —
          например, прямая ссылка на пост в Boosty. Заполнять все четыре
          не нужно: подменяется только то, что вписано.
        fields:
          - label: Boosty
            name: boosty
            widget: string
            required: false
            default: ''
            pattern:
              - '^$|^https?://'
              - Адрес должен начинаться с https:// — или оставьте строку пустой.
          - label: Patreon
            name: patreon
            widget: string
            required: false
            default: ''
            pattern:
              - '^$|^https?://'
              - Адрес должен начинаться с https:// — или оставьте строку пустой.
          - label: Закрытый TG-канал
            name: tgClosed
            widget: string
            required: false
            default: ''
            pattern:
              - '^$|^https?://'
              - Адрес должен начинаться с https:// — или оставьте строку пустой.
          - label: VK Donat
            name: vkDonat
            widget: string
            required: false
            default: ''
            pattern:
              - '^$|^https?://'
              - Адрес должен начинаться с https:// — или оставьте строку пустой.
      # ▼ Всё телеграмное: одна галочка и два служебных поля. Стоит в самом низу
      # нарочно — при работе с обычным постом это не нужно ни разу, а место
      # наверху дорого́е. Держать их вместе важнее удобства: галочка ниже
      # работает ТОЛЬКО у постов, привезённых из телеграма, и рядом с обложкой
      # она выглядела бы работающей у любого поста.
      #
      # ГАЛОЧКА — ЭТО КНОПКА, КОТОРОЙ У НАС БЫТЬ НЕ МОЖЕТ. Sveltia целиком живёт
      # в браузере: сходить на сервер за картинкой, уменьшить её и положить
      # в репозиторий она не умеет. Настоящая кнопка стоила бы третьего воркера;
      # цена названа, вариант отвергнут (тз/7.2). Вместо неё — галочка, на
      # которую срабатывает робот .github/workflows/telegram-photos.yml.
      - label: Забрать картинки с сервера
        name: pullMedia
        widget: boolean
        default: false
        required: false
        hint: >-
          Только для постов, привезённых из телеграма, и только пока они
          в черновиках. Поставьте галочку и сохраните — через пару минут
          картинки этого поста приедут с сервера: первая встанет в обложку
          и в начало текста, остальные одним блоком после текста. Галочка
          снимется сама. ОСТАЛАСЬ СТОЯТЬ — значит картинок не нашлось, и вам
          пришло письмо с причиной. После сохранения ЗАКРОЙТЕ эту вкладку
          и откройте админку заново: пока она открыта, она держит свою копию
          поста и следующим сохранением затрёт привезённые картинки.
      #
      # НОМЕР — ЕДИНСТВЕННОЕ, ЧЕМ ИМПОРТ УЗНАЁТ СВОЁ. Сотрёте его — следующий
      # прогон заведёт этот пост ЗАНОВО, вторым файлом. Заголовок и текст
      # для узнавания не годятся: вы их правите, а номер не меняется никогда.
      # По нему же робот находит картинки поста в экспорте.
      - label: Номер поста в телеграме
        name: tgId
        widget: number
        required: false
        value_type: int
        hint: >-
          Заполняет импорт. По нему повторный прогон понимает, что этот пост
          уже перенесён, и не заводит его второй раз. Не стирайте и не меняйте.
      # `pattern` Sveltia проверяет ВСЕГДА, в том числе на пустом значении, —
      # `required: false` на это не влияет никак. Поэтому пустота разрешена
      # прямо в выражении (`^$|…`): иначе поле стало бы обязательным
      # по побочному действию, и человек видел бы «адрес должен начинаться
      # с https://» на пустой строке. На эти грабли в проекте наступали дважды.
      - label: Ссылка на пост в телеграме
        name: tgUrl
        widget: string
        required: false
        pattern:
          - '^$|^https://t\.me/'
          - Адрес должен начинаться с https://t.me/ — или оставьте поле пустым.
        hint: >-
          Заполняет импорт. Нужна, чтобы одним нажатием открыть оригинал
          и сверить текст с тем, что было в канале.

  # Отдельные страницы сайта. Это «файловая коллекция»: записи не создаются
  # и не удаляются, их список известен заранее и записан прямо здесь.
  #
  # Почему «О проекте» не сделана обычным постом: у неё нет даты, и в ленту,
  # в RSS и в поиск она попадать не должна.
  #
  # Ссылок на площадки тут нет намеренно — они лежат в src/data/platforms.js
  # и выводятся ещё в подвале, на «Поддержать» и на кнопках бонуса. Через
  # админку правится текст, а не устройство сайта.
  - name: pages
    label: Страницы
    files:
      # Страница «О проекте» (тз/10.4). НАЗВАНИЕ СМЕНИЛОСЬ, АДРЕС НЕТ:
      # страница по-прежнему живёт по `/about/` и в файле `about.md`.
      #
      # СПИСОК ЛЮДЕЙ — ВСТРОЕННЫЙ `list`, а не свой компонент редактора:
      # списки внутри своего компонента Sveltia дважды теряла и портила
      # (CLAUDE.md). Встроенный проверен руками на «Ведущих» и «Кнопках» поста.
      - name: about
        label: О проекте
        file: src/content/pages/about.md
        # Тот же формат, что у постов: поля сверху, текст markdown снизу.
        format: frontmatter
        fields:
          - label: Первая фраза
            name: lead
            widget: text
            required: false
            hint: >-
              Крупная строка справа от заголовка — она же становится описанием
              страницы в поиске Google и в превью, когда ссылку кидают в чат.
              Одно предложение. Пусто — крупной строки не будет, останется
              только текст под ней.
          - label: Текст под первой фразой
            name: body
            widget: richtext
            # Кнопок разметки меньше, чем у поста, и это нарочно. «Аниме»
            # нет совсем: она рассчитана на пост и складывает найденные
            # тайтлы в поле «anime», которого у этой страницы не существует.
            # Список ДОЛЖЕН совпадать с тем, что зарегистрировано
            # в public/admin/index.html: пока он тут задан, Sveltia показывает
            # в меню ТОЛЬКО перечисленное в нём.
            editor_components: [figure]
            hint: >-
              Обычные абзацы под крупной строкой. Пусто — их не будет.
              Картинку сюда лучше не вставлять: это узкая колонка рядом
              с заголовком, места под неё там нет.
          - label: Надзаголовок блока «Команда»
            name: hostsNote
            widget: string
            required: false
            hint: >-
              Мелкая розовая строчка над заголовком «Команда».
              Пусто — её не будет, заголовок останется.
          - label: Команда
            name: hosts
            widget: list
            required: false
            hint: >-
              Сколько человек заведёте, столько и покажется — хоть двое,
              хоть пятеро. Очистите список целиком, и блок «Команда» пропадёт
              со страницы вместе с заголовком и линией.
            # summary — что видно в свёрнутой строке списка, иначе там
            # будет безликое «Команда 1».
            summary: '{{fields.name}}'
            fields:
              - { label: Имя, name: name, widget: string, required: false }
              - label: Кто это
                name: role
                widget: string
                required: false
                hint: >-
                  Мелкой розовой строчкой над именем. Одной строкой: чем
                  занимается в проекте. Несколько ролей разделяйте точкой
                  посередине: «Ведущий · сценарист».
              - label: Фото
                name: photo
                widget: image
                required: false
                hint: >-
                  Необязательно. Пока фото нет, в кружке показывается персонаж
                  из общей заглушки — не пустой кружок и не дыра. Картинка
                  обрезается в круг, поэтому лучше квадратная и с лицом
                  по центру. На сайт попадёт сжатая копия (около 25 КБ),
                  но САМ файл ложится в репозиторий как есть и остаётся там
                  навсегда — снимок прямо с фотоаппарата на 14 МБ лучше
                  сначала уменьшить до 1000 пикселей.
              - label: О человеке
                name: bio
                widget: text
                required: false
                hint: >-
                  Абзац под именем: чем занимается помимо «Баки!», где ещё
                  его можно почитать или послушать. Пусто — абзаца не будет.
              - label: Подпись ссылки
                name: urlLabel
                widget: string
                required: false
                hint: >-
                  Что написано на ссылке: «Telegram», «Сайт», «ВКонтакте».
                  Пусто, но адрес заполнен — напишется просто «Ссылка».
              - label: Адрес ссылки
                name: url
                widget: string
                required: false
                # ПУСТОТА РАЗРЕШЕНА ПРЯМО В ВЫРАЖЕНИИ (`^$|`). Проверка формата
                # у Sveltia гоняется ВСЕГДА, и на пустом значении тоже:
                # `required: false` на это не влияет никак. Без `^$|` поле
                # стало бы обязательным по побочному действию, и человек,
                # добавив пустого человека, увидел бы не «заполните поле»,
                # а разговор про https://.
                pattern:
                  ['^$|^https?://', 'Адрес должен начинаться с https:// — скопируйте его из адресной строки браузера']
                hint: >-
                  Необязательно: телеграм, соцсеть или сайт. Пусто — строки
                  со ссылкой под человеком не будет вовсе.
          - label: Надзаголовок блока «Слушать подкаст»
            name: listenNote
            widget: string
            required: false
            hint: >-
              Мелкая розовая строчка над заголовком. Сами площадки идут
              из общих настроек сайта, вписывать их сюда не надо.
              Пусто — строчки не будет, заголовок и площадки останутся.
          - label: Надзаголовок блока «Ещё немного нас»
            name: socialNote
            widget: string
            required: false
            hint: >-
              То же самое над блоком с соцсетями. Сами соцсети и подписи
              к ним идут из общих настроек сайта.
          - label: Заголовок блока поддержки
            name: supportTitle
            widget: string
            required: false
            hint: >-
              Строка рядом с обложкой. Пусто — напишется
              «Поддержать «Баку!»».
          - label: За что поддержать
            name: supportNote
            widget: text
            required: false
            hint: >-
              Абзац под этим заголовком: за что вы просите поддержки и что
              получают подписчики. Пусто — абзаца не будет, останутся заголовок
              и кнопки. Сами кнопки идут из общих настроек сайта.
          - label: Текст про почту
            name: contactText
            widget: text
            required: false
            hint: >-
              Абзац перед адресом почты: по каким вопросам писать.
              Пусто — абзаца не будет, останется сама почта.
          - label: Почта для связи
            name: contactEmail
            widget: string
            required: false
            # Пустота разрешена в самом выражении — по той же причине, что
            # у адресов ссылок выше.
            pattern: ['^$|^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Похоже, это не адрес почты: нужен вид имя@домен.ру']
            hint: >-
              Очистите это поле и «Текст про почту» — блок «Написать нам»
              пропадёт со страницы целиком. Ссылки на чат тут больше нет:
              чат стоит в блоке «Ещё немного нас» и идёт из общих настроек.

      # Страница «Поддержать» (тз/08, часть 10.1).
      #
      # КНОПОК ПЛОЩАДОК ЗДЕСЬ НЕТ, и это не забывчивость: Boosty, Patreon,
      # закрытый TG-канал и VK Donat лежат одним списком в src/data/platforms.js
      # и оттуда же попадают в подвал и на кнопки бонусного выпуска. Заведи
      # их вторым списком тут — и смена ссылки чинилась бы в двух местах,
      # а забывалась в одном.
      #
      # СПИСКИ — ВСТРОЕННЫЕ `list`, а не свой компонент редактора: списки
      # внутри своего компонента Sveltia дважды теряла и портила (CLAUDE.md).
      # Встроенный `list` проверен руками на «Ведущих» и «Кнопках» поста.
      - name: support
        label: Поддержать
        file: src/content/pages/support.md
        format: frontmatter
        fields:
          - label: Первая фраза
            name: lead
            widget: text
            required: false
            hint: >-
              Крупная строка справа от заголовка — она же становится описанием
              страницы в поиске Google и в превью, когда ссылку кидают в чат.
              Одно предложение. Пусто — крупной строки не будет, останется
              только текст под ней.
          - label: Текст под первой фразой
            name: body
            widget: richtext
            # Кнопок разметки меньше, чем у поста, и это нарочно: «Аниме»
            # складывает найденные тайтлы в поле, которого у этой страницы
            # нет вовсе. Список ДОЛЖЕН совпадать с тем, что зарегистрировано
            # в public/admin/index.html: пока он тут задан, Sveltia показывает
            # в меню ТОЛЬКО перечисленное в нём.
            editor_components: [figure]
            hint: >-
              Обычный текст под крупной строкой. Пусто — абзаца не будет.
              Картинку сюда лучше не вставлять: это узкая колонка рядом
              с заголовком, места под неё там нет.
          - label: Подпись к блоку «Что даёт подписка»
            name: benefitsNote
            widget: string
            required: false
            hint: >-
              Строчка справа от заголовка блока. Пусто — её не будет,
              заголовок останется.
          - label: Что даёт подписка
            name: benefits
            widget: list
            required: false
            hint: >-
              Пункты идут в два столбца слева направо. Очистите список
              целиком — блок пропадёт со страницы вместе с заголовком.
            # summary — что видно в свёрнутой строке списка, иначе там будет
            # безликое «Что даёт подписка 1».
            summary: '{{fields.text}}'
            fields:
              - label: Пункт
                name: text
                widget: text
                required: false
                hint: >-
                  Номер (01, 02, 03…) считает сайт сам — вписывать его не надо,
                  иначе после удаления пункта номера пойдут через один. Пустой
                  пункт не показывается. Очистите список целиком — блок
                  «Что даёт подписка» пропадёт со страницы вместе с заголовком.
          - label: Текст блока «Помочь иначе»
            name: altText
            widget: text
            required: false
            hint: >-
              Абзац про то, чем помочь, кроме денег. Пусто — абзаца не будет.
          - label: Ссылки блока «Помочь иначе»
            name: altLinks
            widget: list
            required: false
            summary: '{{fields.label}}'
            hint: >-
              Кнопки Boosty, Patreon и остальных площадок поддержки сюда
              вписывать не надо: они стоят выше и берутся из общих настроек
              сайта. Здесь — всё остальное: соцсети, ссылка «поделиться»,
              что угодно ещё.
            fields:
              - { label: Подпись, name: label, widget: string, required: false }
              - label: Адрес
                name: url
                widget: string
                required: false
                # ПУСТОТА РАЗРЕШЕНА ПРЯМО В ВЫРАЖЕНИИ (`^$|`). Проверка формата
                # у Sveltia гоняется ВСЕГДА, и на пустом значении тоже:
                # `required: false` на это не влияет никак. Без `^$|` поле
                # стало бы обязательным по побочному действию, и человек,
                # добавив пустую строку, увидел бы не «заполните поле»,
                # а разговор про https://.
                pattern:
                  ['^$|^https?://', 'Адрес должен начинаться с https:// — скопируйте его из адресной строки браузера']
                hint: >-
                  Строка без подписи или без адреса на странице не показывается:
                  слово, которое выглядит ссылкой, но никуда не ведёт, хуже
                  отсутствующей строки. Очистите список целиком — блок
                  «Помочь иначе» пропадёт вместе с заголовком, если и текст
                  над ним пуст.

  # Справочник тайтлов. Здесь правятся руками четыре вещи: русское название,
  # описание, обложка и варианты написания (см. CLAUDE.md, раздел «Тайтл»).
  # Заодно эта полка нужна полю «Тайтлы поста» выше, чтобы искать по ней.
  #
  # Создание новых тайтлов отсюда выключено (create: false): каждый новый тайтл —
  # это ещё и скачанная и сжатая обложка, а это умеет делать только кнопка
  # «Аниме» в тексте (робот на GitHub донабирает данные) или
  # scripts/fetch-anime.mjs, но не сама CMS.
  - name: anime
    label: Аниме
    label_singular: Тайтл
    folder: src/content/anime
    create: false
    delete: false
    format: json
    extension: json
    summary: '{{titleRu}} ({{titleOriginal}})'
    fields:
      - label: ID (slug, часть адреса /anime/…)
        name: id
        widget: string
        hint: 'Не меняйте — это часть адреса страницы, правка тут файл не переименует и сломает ссылки.'
      - label: Источник данных
        name: source
        widget: select
        options: [shikimori, anilist]
      - { label: ID в источнике, name: sourceId, widget: number, value_type: int }
      - label: Русское название
        name: titleRu
        widget: string
        required: false
        hint: >-
          Правьте смело: у тайтлов из AniList русского названия не бывает вовсе,
          да и Shikimori иногда даёт не тот перевод, к которому все привыкли.
      - { label: Оригинальное название, name: titleOriginal, widget: string }
      - label: Варианты написания
        name: aliases
        widget: alias-list
        required: false
        hint: >-
          По этим словам упоминания в расшифровках ищутся наравне с названием:
          падежи («Ходячего замка»), то, как тайтл называют вслух («K-On!»
          вместо «Кэйон!»), и то, как его коверкает распознавание («Фринен»).
          Вписанное один раз ловится сразу во всём архиве и во всех будущих
          выпусках, заново распознавать ничего не нужно. Ниже подсказки — что
          реально звучит в архиве и что знает Shikimori; само ничего
          не добавляется. Не берите короткие обычные слова: поймается вся речь.
      - label: Падежные формы (считаются сами)
        name: aliasesAuto
        widget: auto-alias-list
        required: false
        hint: >-
          Это поле только показывает. Формы русского названия считает морфология,
          и ищутся они наравне с вариантами выше: написали «в Ходячем замке» —
          упоминание найдётся само. Править тут нечего: любая правка была бы
          стёрта ближайшим пересчётом. Не хватает формы — впишите её в «Варианты
          написания» строкой выше, оттуда её не сотрёт ничто и никогда.
      - { label: Год, name: year, widget: number, required: false, value_type: int }
      - { label: Студия, name: studio, widget: string, required: false }
      - { label: Обложка (путь в public/anime/), name: poster, widget: string, required: false }
      - { label: Описание, name: synopsis, widget: text, required: false }
      - { label: Ссылка на источник, name: url, widget: string, required: false }
      - label: Не обновлять из Shikimori/AniList
        name: manual
        widget: select
        multiple: true
        required: false
        options:
          - { label: Русское название, value: titleRu }
          - { label: Описание, value: synopsis }
          - { label: Обложка, value: poster }
        hint: >-
          Отмеченное здесь считается вашим: при обновлении данных из источника
          такое поле не перезаписывается. Ставить галочки самому обычно не нужно —
          админка отмечает поле сама, как только вы его поправите. Снимите
          галочку, если передумали и хотите снова получать это поле из источника
          (например, обложку).
