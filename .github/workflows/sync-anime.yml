name: Добор тайтлов из постов

# После публикации поста в тексте могут быть метки тайтлов, которых ещё нет
# в справочнике (src/content/anime/) — кнопка «Аниме» в админке ставит метку
# сразу, а данные и обложку добирает этот робот (scripts/sync-anime.mjs),
# см. тз/03-тайтлы.md. Запускается сам после каждого пуша с изменениями
# в постах, коммитит найденное обратно в репозиторий — руками ничего
# запускать не нужно.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-anime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Добрать новые тайтлы
        run: node scripts/sync-anime.mjs

      - name: Закоммитить, если нашлось что-то новое
        run: |
          git config user.name "baka-anime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/anime public/anime
          if git diff --cached --quiet; then
            echo "Новых тайтлов нет."
          else
            git commit -m "Добавить тайтлы, размеченные в постах"
            git pull --rebase origin main
            git push
          fi

      # РОБОТ, УПАВШИЙ МОЛЧА, ОБНАРУЖИВАЕТСЯ ЧЕРЕЗ НЕДЕЛИ (ревизия 15 августа
      # 2026, находка 4). У этого робота уведомления не было вовсе: он
      # единственный из восьми не умел сказать о себе ничего. А падать ему есть
      # от чего — он ходит в чужой сервис за данными и обложками и пишет
      # в репозиторий, где в те же секунды может сохраняться админка.
      #
      # ПИСЬМО ТОЛЬКО ПРИ ПАДЕНИИ. Удачную работу видно в каталоге, а «всё
      # хорошо» через неделю перестают читать вместе с письмами о том, что плохо.
      - name: Сказать, если робот упал
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Тело письма собирается в файл, а не в heredoc: закрывающий маркер
          # heredoc обязан стоять в начале строки, а внутри YAML всё с отступом.
          {
            echo "Робот, который заводит карточки тайтлов, размеченных в постах, не доделал работу."
            echo ""
            echo "**Что это значит на сайте.** Название, отмеченное в тексте кнопкой «Аниме»,"
            echo "ссылкой не станет: карточки такого тайтла в справочнике нет. Страница поста"
            echo "при этом цела, сборка проходит — просто вместо ссылки обычный текст."
            echo ""
            echo "**Что делать.** Ничего срочного: робот ходит снова после каждой публикации"
            echo "поста и на следующем заходе доберёт то, что не успел. Если не доберёт —"
            echo "скажите мне, посмотрим, на чём он спотыкается."
            echo ""
            echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh issue create \
            --title "Робот добора тайтлов упал" \
            --body "$(cat issue.md)" \
            --assignee eduard1414ed
