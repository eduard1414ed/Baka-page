name: Добор выпусков из RSS

# Раз в день делает две вещи, см. тз/04-выпуски-и-плеер.md и тз/05-транскрипты.md
# (шаг 7):
#
#   1. Проверяет RSS подкаста и заводит черновик для каждого выпуска, у которого
#      ещё нет поста (scripts/sync-episodes.mjs).
#   2. Расшифровывает выпуски без транскрипта и подставляет сценарий там, где
#      он появился у поста (scripts/transcribe/auto.py).
#
# Опубликованные посты не трогает никогда — только создаёт новые файлы.
# Коммитит результат сам, руками запускать не нужно (но можно — кнопкой
# «Run workflow» на вкладке Actions).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Повторить сбойные (выпуски, на которых робот уже отступился)'
        type: boolean
        default: false
      limit:
        description: 'Сколько выпусков расшифровать за прогон'
        type: string
        default: '2'

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # ПРЕДЕЛ ПО ВРЕМЕНИ, И ОН ЗДЕСЬ САМЫЙ БОЛЬШОЙ — НАРОЧНО. Этот робот делает
    # ЧЕТЫРЕ разные работы подряд: добор выпусков из RSS, вырезание персонажей
    # с обложек, установку ffmpeg с библиотеками и РАСПОЗНАВАНИЕ РЕЧИ у чужого
    # сервиса. У последнего свой срок — час на выпуск (`scripts/transcribe/`,
    # посчитан по самому длинному выпуску архива в 94 минуты), и берётся до двух
    # выпусков за заход.
    #
    # ПОЭТОМУ ПРЕДЕЛ НЕ «ВТРОЕ ОТ ОБЫЧНОГО», А ЧУТЬ БОЛЬШЕ ХУДШЕГО ЧЕСТНОГО:
    # оборвать оплаченное распознавание на середине — это выброшенные деньги,
    # а не спасённая очередь. Полтора часа меньше шестичасового предела GitHub
    # и больше любого честного прогона.
    #
    # Журнал прогонов на GitHub пуст (пометка «спам» унесла историю,
    # задача-20), поэтому число выведено из сроков внутри самой работы,
    # а не из наблюдений.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Добрать новые выпуски
        run: node scripts/sync-episodes.mjs

      # --- Персонаж вместо обложки (тз/12) ----------------------------------
      #
      # Зовёт ТОТ ЖЕ скрипт, что гонял весь архив, — второй копии правил
      # обработки нет и быть не должно: разъехались бы молча, и новые выпуски
      # начали бы отличаться от архива.
      #
      # --new берёт только те обложки, которых нет в журнале
      # src/data/coverCutoutLog.mjs. Архив в журнале весь, поэтому робот его
      # не трогает никогда, даже если что-то покажется ему подозрительным.
      #
      # Записывается ТОЛЬКО «чисто»: у робота нет глаз, а сомнительный
      # результат хуже обычной обложки — персонаж с куском подписи или дырой
      # в контуре остался бы на сайте навсегда. Всё, что не применено,
      # уезжает строчкой в задачу на GitHub (notify-covers.md ниже).
      #
      # continue-on-error: за расшифровку следующего шага плачены деньги,
      # и падение картинок не имеет права её отменить.
      - name: Вырезать персонажей с новых обложек
        continue-on-error: true
        run: node scripts/cover-cutout.mjs --new --write --notify=notify-covers.md

      - name: Закоммитить, если нашлось что-то новое
        run: |
          git config user.name "baka-episodes-bot"
          git config user.email "actions@users.noreply.github.com"
          # public/episodes — сжатые обложки новых выпусков, их скрипт кладёт
          # рядом с черновиком (см. scripts/episode-cover-lib.mjs).
          # src/data/episodeCovers.mjs — список скачанных обложек, его читает
          # сборка сайта. Без этих строк и то и другое осталось бы
          # незакоммиченным, и обложка нового выпуска приехала бы мегабайтом.
          #
          # public/cutout, coverCutouts.mjs, coverCutoutLog.mjs — вырезанные
          # персонажи, список для сайта и журнал обработки. Без журнала робот
          # назавтра счёл бы эту же обложку новой и разобрал бы её заново.
          # -A у public/cutout: при подмене картинки прежний персонаж
          # УДАЛЯЕТСЯ, а без -A удаление осталось бы незакоммиченным.
          git add src/content/posts public/episodes src/data/episodeCovers.mjs
          git add -A public/cutout src/data/coverCutouts.mjs src/data/coverCutoutLog.mjs
          if git diff --cached --quiet; then
            echo "Новых выпусков нет."
          else
            # Сообщение по тому, что реально изменилось: коммит про «черновики
            # новых выпусков», в котором нет ни одного поста, — это ложь
            # в истории, и читать её потом будем мы же.
            if git diff --cached --name-only | grep -q '^src/content/posts/'; then
              git commit -m "Добавить черновики новых выпусков из RSS"
            else
              git commit -m "Вырезать персонажей с новых обложек"
            fi
            git pull --rebase origin main
            git push
          fi

      # --- Расшифровка (тз/05, шаг 7) ---------------------------------------
      #
      # Живёт здесь, а не на Hetzner: серверный pipeline.py остаётся для
      # массовых прогонов, а один выпуск в месяц обрабатывается прямо в роботе —
      # без SSH и без зависимости от того, включён ли сервер.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Поставить ffmpeg и библиотеки
        # ffmpeg нужен, чтобы измерить высоту голоса и по ней расставить имена
        # ведущих (тз/05, шаг 4). Расшифровка полная и одинаковая для всех
        # выпусков, включая эссе, поэтому обойтись без него нельзя.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy requests

      - name: Расшифровать новое и подставить сценарии
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 scripts/transcribe/auto.py \
            --limit "${{ inputs.limit || '2' }}" \
            ${{ inputs.retry_failed && '--retry-failed' || '' }} \
            --notify-file notify.md

      - name: Закоммитить расшифровки
        # always(), чтобы сбой на одном выпуске не потерял уже готовые: за них
        # заплачено, и второй раз платить нельзя.
        if: always()
        run: |
          git config user.name "baka-episodes-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A, а не список файлов: auto-state.json появляется при сбое
          # и исчезает, когда сбойный выпуск наконец расшифровался.
          git add -A src/content/transcripts transcripts
          if git diff --cached --quiet; then
            echo "Расшифровок не прибавилось."
          else
            git commit -m "Расшифровать новые выпуски"
            git pull --rebase origin main
            git push
          fi

      - name: Свести обложки и расшифровки в одно письмо
        # Письмо всегда одно на прогон: две задачи на GitHub за одно утро
        # читаются как два разных события, хотя событие одно.
        #
        # Первая строка файла — заголовок задачи, дальше через пустую строку
        # тело (так же делает scripts/transcribe/auto.py). Поэтому у второго
        # файла заголовок отбрасывается: tail -n +3.
        if: always()
        run: |
          if [ ! -s notify-covers.md ]; then
            echo "Про обложки писать нечего."
          elif [ -s notify.md ]; then
            printf '\n' >> notify.md
            tail -n +3 notify-covers.md >> notify.md
            echo "Обложки дописаны к письму о расшифровках."
          else
            cp notify-covers.md notify.md
            echo "Письмо будет только про обложки."
          fi

      # РОБОТ, УПАВШИЙ МОЛЧА, ОБНАРУЖИВАЕТСЯ ЧЕРЕЗ НЕДЕЛИ (ревизия 15 августа
      # 2026, находка 4). Письмо ниже приходит, только когда робот САМ решил,
      # что есть о чём сказать, — а падение он объявить не успевает. Этот шаг
      # ловит именно падение, и письма могут прийти оба: одно про дело, второе
      # про то, что робот до конца не дошёл. Это разные события.
      - name: Сказать, если робот упал
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Утренний робот выпусков не доделал работу."
            echo ""
            echo "**Что он должен был сделать.** Проверить RSS подкаста, завести черновик"
            echo "для нового выпуска, вырезать персонажа с обложки и расшифровать звук."
            echo ""
            echo "**Что это значит.** Нового выпуска может не оказаться в черновиках, а если"
            echo "он завёлся — без расшифровки. Уже готовые расшифровки не пропали: за них"
            echo "заплачено, и коммитятся они отдельным шагом, который идёт всегда."
            echo ""
            echo "**Что делать.** Можно ничего: робот ходит каждое утро и доделает. Срочно —"
            echo "кнопка «Забрать новые выпуски подкаста» на /admin/tools/."
            echo ""
            echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-failure.md
          gh issue create \
            --title "Робот выпусков упал" \
            --body "$(cat issue-failure.md)" \
            --assignee eduard1414ed

      - name: Написать на почту
        # Задача в репозитории с исполнителем — GitHub сам шлёт письмо тому,
        # на кого её назначили. Отдельная почтовая служба и пароли не нужны.
        if: always() && hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(head -n 1 notify.md)" \
            --body "$(tail -n +3 notify.md)" \
            --assignee eduard1414ed
