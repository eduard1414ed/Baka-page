name: Кандидаты в тайтлы из черновиков

# ЕДИНСТВЕННЫЙ МОМЕНТ ПРОВЕРКИ — СОХРАНЕНИЕ ЧЕРНОВИКА (тз/11, C.3), чьё угодно:
# ваше в админке или робота импорта, который завёл черновик сам. Робот собирает
# из черновиков фразы в кавычках, спрашивает у Shikimori ТОЛЬКО те, о которых
# раньше не спрашивал, и складывает найденное в `src/data/animeCandidates.json` —
# это то, что показывает экран на /admin/tools/.
#
# НИ ОДИН ТАЙТЛ ОН НЕ ЗАВОДИТ. Решение принимает человек кнопкой, исполняет
# его второй воркфлоу — `anime-candidates-apply.yml`.
#
# ОПУБЛИКОВАННЫЕ ПОСТЫ НЕ ПЕРЕПРОВЕРЯЮТСЯ (ключ `--only-drafts`): они уже прошли
# через черновик, а публикация случается через месяцы, когда контекст забыт.
#
# СОБСТВЕННЫЙ КОММИТ РОБОТА ЕГО НЕ БУДИТ: он пишет в `src/data/`, а просыпается
# на `src/content/posts/`. Плюс он идемпотентен — берётся только за фразы,
# которых ещё не спрашивал, и повторный заход по тем же постам не спрашивает
# ничего.
#
# ГРУППА ОЧЕРЕДИ ОБЩАЯ С ПРИМЕНЕНИЕМ РЕШЕНИЙ: оба пишут в один файл, и работать
# разом им нельзя. `cancel-in-progress: false` — потому что применение решений
# отменять нельзя на середине; GitHub при этом держит в очереди только один
# ждущий заход, так что десять сохранений подряд не дадут десяти прогонов.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anime-candidates
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      # РАБОЧАЯ КОПИЯ — СВЕЖАЯ ВЕТКА, А НЕ СНИМОК РАЗБУДИВШЕГО КОММИТА. Очередь
      # группы не даёт двум прогонам работать разом, но ждущий всё равно берёт
      # снимок ТОГО сохранения, которое его завело: 12 августа прогон начал
      # работу через девять секунд после того, как предыдущий записал свой
      # список, разобрал устаревшую копию, переписал файл целиком и лёг
      # столкновением на `git pull --rebase`. Разбор без ключа `ref` был бы
      # верен, если бы файл принадлежал только этому заходу; а он один общий
      # и переписывается целиком, поэтому свежесть копии — часть работы.
      # Воспроизведение и подлог — `node scripts/candidates-rebase.test.mjs`.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # ПРЕДЕЛ НА ЧИСЛО ВОПРОСОВ — заслон, а не оптимизация. Обычное сохранение
      # даёт единицы новых фраз; шестьдесят означало бы, что в репозиторий
      # приехала целая пачка постов, и полторы секунды на запрос превратились бы
      # в получасовой прогон. Упёршись в предел, робот скажет об этом вслух,
      # а остаток доспросит следующим заходом.
      - name: Разобрать новые фразы
        run: node scripts/anime-candidates.mjs --write --only-drafts --max-ask 60 | tee report.txt

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "baka-anime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/animeCandidates.json
          if git diff --cached --quiet; then
            echo "Список кандидатов не изменился."
          else
            git commit -m "Кандидаты в тайтлы: разобраны новые фразы из черновиков"
            git pull --rebase origin main
            git push
          fi

      # ПИСЬМО ПРИХОДИТ, ТОЛЬКО КОГДА ЕСТЬ ЧТО СКАЗАТЬ. «Сходил, ничего нового»
      # через неделю перестают читать, а вместе с ним перестают читать и письма
      # о находках. Признак — строка «СТРОК, ЖДУЩИХ ВАШЕГО РЕШЕНИЯ» в отчёте.
      - name: Рассказать, если нашлось новое
        if: always() && hashFiles('report.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q 'СТРОК, ЖДУЩИХ ВАШЕГО РЕШЕНИЯ' report.txt; then
            gh issue create \
              --title "Кандидаты в тайтлы: есть новое" \
              --body "$(head -c 60000 report.txt)" \
              --assignee eduard1414ed
          else
            echo "Нового нет — письмо не отправляю."
          fi
