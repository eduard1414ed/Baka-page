# ВРЕМЕННЫЙ робот. Один вопрос: дотягивается ли GitHub Actions до российского
# хранилища (задача 13, пункт 1). Выкладка идёт с чужих машин, путь до Москвы
# никто не проверял, и узнать это надо ДО того, как писать саму выкладку.
#
# Ничего в бакете не оставляет: кладёт один файл, читает обратно, стирает.
# После ответа этот файл удаляется — постоянного робота зеркала он не заменяет.
name: Проба связи с зеркалом

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: 'true'
      ENDPOINT: https://storage.yandexcloud.net
      BUCKET: ru.bakapodcast.com
    steps:
      - name: Есть ли вообще сеть до Москвы
        run: |
          set -o pipefail
          echo "— HTTP-ответ хранилища (важен КОД, а не тело):"
          curl -s -o /dev/null -w '  код %{http_code}, соединение %{time_connect} с, весь ответ %{time_total} с\n' \
            --max-time 30 "$ENDPOINT" || { echo "  СЕТИ НЕТ ВОВСЕ"; exit 1; }

      - name: Ключи и права — видит ли сервисный аккаунт бакет
        run: |
          set -o pipefail
          # Имя бакета с точками требует path-style: иначе имя уедет в домен
          # (ru.bakapodcast.com.storage.yandexcloud.net) и сертификат не сойдётся.
          aws configure set default.s3.addressing_style path
          echo "— перечисление бакета:"
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
            --max-items 20 --query 'Contents[].Key' --output text

      - name: Пробная заливка одного файла
        run: |
          set -o pipefail
          aws configure set default.s3.addressing_style path
          echo "проба связи $(date -u +%FT%TZ), прогон ${{ github.run_id }}" > proba.txt
          echo "— заливка:"
          time aws s3api put-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
            --key .proba-svyazi.txt --body proba.txt --content-type 'text/plain; charset=utf-8' \
            --query 'ETag' --output text
          echo "— чтение обратно:"
          aws s3api get-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
            --key .proba-svyazi.txt obratno.txt --query 'ContentLength' --output text
          cat obratno.txt
          echo "— совпало ли:"
          cmp proba.txt obratno.txt && echo "  ДА, файл доехал и вернулся целым"

      - name: Замер скорости — 20 МБ, чтобы понять, сколько займёт настоящая выкладка
        run: |
          set -o pipefail
          aws configure set default.s3.addressing_style path
          head -c 20000000 /dev/urandom > big.bin
          echo "— заливка 20 МБ:"
          time aws s3api put-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
            --key .proba-svyazi.bin --body big.bin --query 'ETag' --output text

      - name: Убрать за собой
        if: always()
        run: |
          aws configure set default.s3.addressing_style path
          aws s3api delete-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key .proba-svyazi.txt || true
          aws s3api delete-object --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --key .proba-svyazi.bin || true
          echo "— что осталось в бакете:"
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" \
            --query 'Contents[].Key' --output text
