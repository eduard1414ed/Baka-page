# ЗЕРКАЛО ДЛЯ РОССИИ: собрать сайт и залить его в Yandex Object Storage.
#
# ПОЧЕМУ ЭТО ОТДЕЛЬНЫЙ РОБОТ, А НЕ ЧАСТЬ ВЫКЛАДКИ ОСНОВНОГО САЙТА.
# Основной сайт собирает и выкладывает САМ CLOUDFLARE (Workers Builds) — он
# подключён к репозиторию через приложение GitHub и просыпается на каждый пуш.
# Встроить заливку зеркала туда нельзя по двум причинам сразу: ключи Яндекса
# пришлось бы держать в настройках сборки Cloudflare, а не в секретах
# репозитория, и сбой заливки ронял бы выкладку ОСНОВНОГО сайта. ТЗ требует
# обратного: основная выкладка главнее.
#
# Поэтому здесь второй прогон, разбуженный тем же самым пушем. Оба берут ОДИН
# И ТОТ ЖЕ коммит, то есть собирают одни и те же исходники. Цена названа
# и принята 11 августа 2026: сборок две, разъехаться им не на чем, зеркало
# отстаёт от основного сайта на минуту-две.
#
# СБОЙ ЗДЕСЬ НА ОСНОВНОЙ САЙТ НЕ ВЛИЯЕТ ВООБЩЕ НИКАК — это разные прогоны
# у разных хозяев. Молча он при этом не падает: заводится задача на GitHub,
# она же письмо.
name: Зеркало для России

on:
  push:
    branches: [main]
    # Документы в собранный сайт не попадают вовсе — будить робота ради них
    # незачем. Список нарочно короткий: лишняя строка тут означала бы, что
    # правка молча не доехала до зеркала.
    paths-ignore:
      - 'статус/**'
      - 'тз/**'
      - '*.md'
      - 'отчёт-*.txt'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Только посчитать, ничего не заливать'
        type: boolean
        default: false
      force:
        description: 'Перезалить всё целиком, даже совпавшее'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Два прогона разом опасны по-настоящему: они дерутся за один бакет, и старший
# может стереть то, что младший только что положил. Поэтому старший гасится —
# младший знает более свежий коммит и всё равно доложит бакет до полного.
concurrency:
  group: mirror-sync
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # ЗАСЛОН ПЕРЕД РАБОТОЙ, как у применения решений по кандидатам: правила
      # заливки решают, что стереть из бакета, и гонять их сломанными нельзя.
      # Второй прогон — подлогами: «пусто» у проверки ничего не значит, пока
      # не показано, что она умеет находить.
      - name: Проверить правила заливки
        run: |
          set -o pipefail
          node scripts/mirror-sync.test.mjs
          node scripts/mirror-sync.test.mjs --подлог

      - name: Собрать сайт
        run: npm run build

      - name: Залить на зеркало
        id: sync
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # `node … | tee` съедает код возврата: исход берётся у `tee`, а тот
          # не падает никогда. Без этой строки провал заливки считался бы удачей.
          set -o pipefail
          node scripts/mirror-sync.mjs \
            ${{ inputs.dry && '--dry' || '' }} \
            ${{ inputs.force && '--force' || '' }} | tee mirror-report.txt

      - name: Сказать, если не вышло
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Письмо приходит, только когда НЕ вышло: удачную заливку видно
          # на самом зеркале, а письмо «всё хорошо» через неделю перестают
          # читать — и вместе с ним перестают читать письма о том, что плохо.
          {
            echo "Основной сайт это НЕ ЗАТРОНУЛО: его собирает и выкладывает Cloudflare"
            echo "отдельным прогоном. На bakapodcast.com всё вышло как обычно; не обновилось"
            echo "только зеркало ru.bakapodcast.com."
            echo ""
            echo "Коммит: ${{ github.sha }}"
            echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Что успел сказать робот:"
            echo ""
            if [ -f mirror-report.txt ]; then cat mirror-report.txt; else echo "(до заливки дело не дошло — упало раньше)"; fi
          } > issue.txt
          gh issue create \
            --title "Зеркало для России не обновилось" \
            --body "$(head -c 60000 issue.txt)" \
            --assignee eduard1414ed
