name: Применить решения по кандидатам

# Кнопка «Применить решения» на /admin/tools/ (тз/11, C.5). Экран сам ничего
# не применяет: он записывает решения в `src/data/animeCandidateDecisions.json`,
# а этот робот их исполняет.
#
#   «Завести»       — тайтл добавляется в справочник СУЩЕСТВУЮЩИМ механизмом:
#                     данные точно по номеру Shikimori, обложка в двух размерах,
#                     падежные формы считаются сразу.
#   «Это уже есть»  — фраза дописывается в «Варианты написания» тайтла.
#   «Не аниме»      — фразы уходят в стоп-лист навсегда.
#
# ПОСЛЕ ПРИМЕНЕНИЯ СПИСОК ПЕРЕСОБИРАЕТСЯ, БЕЗ СЕТИ (`--no-ask`): заведённый
# тайтл забирает свои фразы из списка сам — они становятся «уже в справочнике», —
# а вписанный вариант и стоп-лист убирают свои строки. Не сделай мы этого,
# заказчик увидел бы на экране решённое ещё раз.
#
# ОТМЕНА НА СЕРЕДИНЕ БЕЗОПАСНА: коммит один и последний. Отменили — не сделано
# ничего, нажмите ещё раз.
#
# ГРУППА ОЧЕРЕДИ ОБЩАЯ с разбором черновиков: оба пишут в один файл.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: anime-candidates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # ПРЕДЕЛ ПО ВРЕМЕНИ. Зависший робот не падает, а висит; предел GitHub
    # по умолчанию — шесть часов. Здесь это особенно неприятно: группа очереди
    # общая со сбором кандидатов, и вставший заход держит обоих.
    #
    # ОТКУДА ЧИСЛО. Записанный замер работы — полторы минуты (статус/карта-кода),
    # тайтлов за раз единицы. Двадцать минут — запас на порядок. Журнал
    # прогонов на GitHub пуст (задача-20), взять число оттуда было нечем.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # ПРОВЕРКИ ПЕРЕД РАБОТОЙ, а не после: применение правит справочник,
      # и запускать его сломанными правилами нельзя. То же самое сделано
      # у пересчёта падежных форм.
      #
      # НО ЗАСЛОН ОБЯЗАН ОБЪЯСНЯТЬСЯ. 11 августа проверка отбора протухла от
      # работы самого заказчика («Баки!» ушло в стоп-лист и перестало быть
      # кандидатом), заперла применение — а в письмо не попало ни слова о том,
      # почему. Заказчик увидел «Решения по кандидатам применены» и пустой
      # отчёт. Поэтому провалившаяся проверка кладёт свои красные строки
      # в отчёт, а зелёная не кладёт ничего: сто строк «ок» в каждом письме
      # хоронят под собой то, ради чего письмо читают.
      - name: Проверить правила отбора
        run: |
          set -o pipefail
          node scripts/anime-candidates.test.mjs 2>&1 | tee /tmp/checks.log || {
            {
              echo "✗✗ ПРОВЕРКИ ПЕРЕД РАБОТОЙ НЕ ПРОШЛИ — НЕ ПРИМЕНЕНО НИЧЕГО."
              echo "Решения на месте. Правила отбора сломаны или протухли:"
              echo
              grep -aE 'ПРОВАЛ|СБОЙ|ПРОВАЛОВ|НЕ ПРОШЛО' /tmp/checks.log || tail -20 /tmp/checks.log
              echo
            } >> report.txt
            exit 1
          }

      # Три проверки самого применения. Первая гоняет НАСТОЯЩИЙ скрипт экрана
      # и спрашивает про порядок во времени, вторая — настоящий текст шага
      # записи в песочнице из git-репозиториев, третья — слияние файла решений.
      # Все три поставлены после 11 августа, когда применение легло на первом же
      # живом нажатии, а прошлые проверки этого не увидели.
      - name: Проверить применение решений
        run: |
          set -o pipefail
          {
            node scripts/candidates-screen.test.mjs &&
            node scripts/candidates-save.test.mjs &&
            node scripts/anime-candidates-decisions-merge.mjs --selftest
          } 2>&1 | tee /tmp/checks-apply.log || {
            {
              echo "✗✗ ПРОВЕРКИ САМОГО ПРИМЕНЕНИЯ НЕ ПРОШЛИ — НЕ ПРИМЕНЕНО НИЧЕГО."
              echo "Решения на месте. Сломан механизм применения:"
              echo
              tail -25 /tmp/checks-apply.log
              echo
            } >> report.txt
            exit 1
          }

      # `set -o pipefail` — иначе исход берётся у `tee`, а он не падает никогда:
      # «не вышло 12 решений» роняет скрипт кодом 1, а шаг считается удачным.
      - name: Применить решения
        id: apply_step
        run: |
          set -o pipefail
          node scripts/anime-candidates-apply.mjs 2>&1 | tee -a report.txt

      # Пересборка списка — всегда, даже если часть решений не применилась:
      # применённое обязано уйти с экрана, иначе заказчик решит его второй раз.
      - name: Пересобрать список кандидатов
        if: always()
        run: node scripts/anime-candidates.mjs --write --no-ask >> report.txt

      # ЗАПИСЬ — ОТДЕЛЬНАЯ РАБОТА, И ОНА УМЕЕТ НЕ ВЫЙТИ. Вкладка заказчика пишет
      # в тот же файл решений, пока робот работает свои полторы минуты: 11 августа
      # `git pull --rebase` встал столкновением ровно на нём и уронил шаг целиком.
      # Тайтл был заведён, обложки скачаны, письмо ушло бодрое — а в репозитории
      # не осталось ничего. Теперь столкновение на этом файле — обычное дело:
      # список решений берётся у вкладки, пометки «применено» возвращаются свои.
      - name: Закоммитить сделанное
        id: save
        if: always()
        run: |
          git config user.name "baka-anime-bot"
          git config user.email "actions@users.noreply.github.com"

          DECISIONS=src/data/animeCandidateDecisions.json

          save_it() {
            git add src/content/anime public/anime src/content/anime-stoplist.json src/data/animeCandidates.json "$DECISIONS" || return 1
            if git diff --cached --quiet; then
              echo "Ничего не изменилось — сохранять нечего." | tee -a report.txt
              return 0
            fi

            # Свои пометки — до всякой возни с ветками: при столкновении рабочая
            # копия файла станет чужой, и взять их будет уже неоткуда.
            cp "$DECISIONS" /tmp/decisions-mine.json || return 1

            git commit -m "Применить решения по кандидатам в тайтлы" || return 1

            for attempt in 1 2 3; do
              git fetch origin main || return 1

              if ! GIT_EDITOR=true git rebase origin/main; then
                # Столкновение бывает ровно на файле решений. Где угодно ещё —
                # это не наш случай, и разбирать его вслепую нельзя.
                conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')
                if [ "$conflicts" != "$DECISIONS" ]; then
                  echo "Столкновение не там, где ждали: [$conflicts]" | tee -a report.txt
                  git rebase --abort || true
                  return 1
                fi
                # Ступень 2 — то, что лежит на GitHub (список от вкладки).
                git show :2:"$DECISIONS" > /tmp/decisions-fresh.json || return 1
                node scripts/anime-candidates-decisions-merge.mjs \
                  /tmp/decisions-fresh.json /tmp/decisions-mine.json > "$DECISIONS" || return 1
                git add "$DECISIONS" || return 1
                # Слияние могло совпасть с тем, что уже лежит на GitHub, —
                # тогда коммиту нечего нести, и `--continue` откажется работать.
                if git diff --cached --quiet && git diff --quiet; then
                  git rebase --skip || return 1
                else
                  GIT_EDITOR=true git rebase --continue || return 1
                fi
              fi

              if git push; then
                echo "" | tee -a report.txt
                echo "✓ ЗАПИСАНО В РЕПОЗИТОРИЙ, коммит $(git rev-parse --short HEAD)." | tee -a report.txt
                return 0
              fi
              echo "Запись не прошла (попытка $attempt из 3) — захожу заново."
            done
            return 1
          }

          if save_it; then
            echo "saved=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "" | tee -a report.txt
          echo "✗✗ СДЕЛАННОЕ НЕ СОХРАНИЛОСЬ В РЕПОЗИТОРИИ — НЕ ПРИМЕНЕНО НИЧЕГО." | tee -a report.txt
          echo "Всё, что написано выше, робот сделал у себя и выбросил вместе с машиной." | tee -a report.txt
          echo "Нажмите «Применить решения» ещё раз — решения на месте, дублей не будет." | tee -a report.txt
          exit 1

      # ЗАГОЛОВОК ПИСЬМА ГОВОРИТ ИСХОД, И СПРАШИВАЕТ ОБ ЭТОМ ДВОИХ. Мало знать,
      # что запись прошла: 11 августа применение вообще не запускалось (заслон
      # проверок не пустил), запись честно ответила «сохранять нечего» — и письмо
      # получило заголовок «применены». Поэтому смотрим и на запись, и на то,
      # чем кончился сам шаг применения; пропущенный шаг — тоже не «применены».
      - name: Прислать отчёт письмом
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAVED: ${{ steps.save.outputs.saved }}
          APPLIED: ${{ steps.apply_step.outcome }}
        run: |
          touch report.txt
          if [ "$SAVED" = "yes" ] && [ "$APPLIED" = "success" ]; then
            TITLE="Решения по кандидатам применены"
            HEAD=""
          elif [ "$APPLIED" != "success" ] && [ "$APPLIED" != "failure" ]; then
            TITLE="Решения по кандидатам НЕ ПРИМЕНЯЛИСЬ — робот не дошёл до работы"
            HEAD="Шаг применения даже не запускался ($APPLIED): его не пустил заслон проверок выше. Решения целы, ничего не тронуто."$'\n\n'
          else
            TITLE="Решения по кандидатам НЕ ПРИМЕНИЛИСЬ ПОЛНОСТЬЮ — смотрите последнюю строку"
            HEAD=""
          fi
          gh issue create \
            --title "$TITLE" \
            --body "$HEAD$(head -c 60000 report.txt)" \
            --assignee eduard1414ed
