name: Забрать новые посты из телеграма

# Задача 7.6. Вышел пост в канале — через несколько часов он лежит в черновиках
# на сайте. Робот спрашивает бота, добавленного администратором в канал, разбирает
# посты тем же кодом, которым привезён весь архив, кладёт черновики и картинки
# в репозиторий и сдвигает отметку о забранном. НА САЙТ САМО НЕ ПОПАДАЕТ НИЧЕГО:
# у всех постов стоит «Черновик», публикует заказчик.
#
# ЧЕТЫРЕ РАЗА В СУТКИ — РЕШЕНИЕ ЗАКАЗЧИКА, И ОНО НЕ СЛУЧАЙНО. Телеграм держит
# невыданное боту около суток; при заходе раз в шесть часов запас до этого
# порога четырёхкратный. Пропусти робот один заход — ничего не случится,
# пропусти двое суток подряд — посты для бота потеряны, и добирать их будет
# запасной путь (страница канала), о чём придёт письмо.
#
# ВРЕМЯ ЗДЕСЬ ПО ГРИНВИЧУ, как и у всякого расписания GitHub. 02:00, 08:00,
# 14:00 и 20:00 UTC — это 04:00, 10:00, 16:00 и 22:00 по Берлину летом
# (по нему записан весь архив) и на час раньше зимой.
#
# РАСПИСАНИЕ GITHUB НЕ ТОЧНОЕ: при большой нагрузке запуск сдвигается
# на десятки минут, а изредка пропускается вовсе. Для нас это безразлично —
# у нас запас в четыре раза, — но ждать поста «ровно в 10:00» не стоит.
#
# ТОКЕН ЖИВЁТ ТОЛЬКО В СЕКРЕТЕ TG_BOT_TOKEN и в переменной окружения одного
# шага. В командную строку он не попадает (иначе светился бы в журнале запуска),
# а всё, что скрипт печатает, проходит через замену токена на «<токен>».

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: telegram-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ПРЕДЕЛ ПО ВРЕМЕНИ. Зависший робот не падает, а висит, и очередь за ним
    # стоит сутки; предел GitHub по умолчанию — шесть часов.
    #
    # ОТКУДА ЧИСЛО. Работа тут короткая: спросить у телеграма непрочитанное
    # и скачать картинки к нему. Каждый поход теперь со сроком 30 секунд
    # (`scripts/retry.mjs`), повторов три, так что даже полностью молчащий
    # телеграм укладывается в единицы минут. Двадцать — запас на пачку постов
    # с картинками. Журнал прогонов на GitHub пуст (задача-20).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Забрать новые посты
        env:
          # Через окружение, а не ключом --token=: командная строка шага видна
          # в журнале запуска целиком, а журнал открыт всякому, у кого есть
          # ссылка на репозиторий.
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          node scripts/telegram-fetch.mjs --write --notify=notify-fetch.md

      - name: Закоммитить привезённое
        run: |
          git config user.name "baka-tg-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          # Отметка о забранном коммитится ВМЕСТЕ с постами и в том же коммите.
          # Иначе после сбоя робот пошёл бы по второму кругу или, наоборот,
          # перешагнул бы непривезённое.
          git add src/content/posts public/images/uploads src/data/telegramFeed.mjs
          if git diff --cached --quiet; then
            echo "Новых постов не было."
          else
            git commit -m "Новые посты из телеграма"
            git pull --rebase origin main
            git push
          fi

      # РОБОТ, УПАВШИЙ МОЛЧА, ОБНАРУЖИВАЕТСЯ ЧЕРЕЗ НЕДЕЛИ (ревизия 15 августа
      # 2026, находка 4). Письмо ниже приходит, только если робот сам успел
      # написать, что требует внимания; падение он объявить не успевает.
      - name: Сказать, если робот упал
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Робот, который забирает новые посты из канала, не доделал работу."
            echo ""
            echo "**Что это значит.** Новых постов может не оказаться в черновиках. На сайте"
            echo "не изменилось ничего: этот робот кладёт всё черновиками, публикуете вы."
            echo ""
            echo "**Пропасть посты не могут.** Очередь у телеграма подтверждается только"
            echo "после удачной записи, а отметка «докуда забрано» коммитится вместе"
            echo "с постами. Упал робот — очередь осталась непочатой, и следующий заход"
            echo "привезёт то же самое."
            echo ""
            echo "**Что делать.** Можно ничего: робот ходит четырежды в сутки. Срочно —"
            echo "кнопка «Забрать новые посты из телеграма» на /admin/tools/."
            echo ""
            echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-failure.md
          gh issue create \
            --title "Робот телеграма упал" \
            --body "$(cat issue-failure.md)" \
            --assignee eduard1414ed

      - name: Написать на почту, если что-то требует внимания
        # Задача в репозитории с исполнителем — GitHub сам шлёт письмо тому,
        # на кого её назначили. Отдельная почтовая служба и пароли не нужны.
        # Письма об удачной работе нет намеренно: новые черновики видно
        # в админке, а письмо «всё хорошо» через неделю перестают читать
        # вместе с письмами о том, что плохо.
        if: always() && hashFiles('notify-fetch.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(head -n 1 notify-fetch.md)" \
            --body "$(tail -n +3 notify-fetch.md)" \
            --assignee eduard1414ed
